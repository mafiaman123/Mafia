<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Tribunal — Mafia Game Master</title>

<!-- Fonts: condensed poster display + clean body + monospace utility for case-file numerics -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:      '#0A0B0D',
          panel:    '#14161B',
          panel2:   '#1B1E25',
          hairline: '#2A2E37',
          gold:     '#C9A227',
          goldDim:  '#8A6F1E',
          mafia:    '#C0392B',
          mafiaDim: '#3A1512',
          town:     '#3E9B6F',
          townDim:  '#123324',
          neutral:  '#8E5FD1',
          neutralDim:'#2A1C3E',
          paper:    '#E9E4D8',
        },
        fontFamily: {
          display: ['Oswald', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      }
    }
  }
</script>

<!-- PeerJS for online co-op -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
  html, body { background:#0A0B0D; }
  * { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background:#2A2E37; border-radius:4px; }
  .font-display { letter-spacing: 0.02em; }
  .case-stamp { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.15em; }
  .tab-fold { clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  .seal { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.15), transparent 60%); }
  .btn-press:active { transform: scale(0.97); }
  .view { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }
  input[type="range"] { accent-color: #C9A227; }
  input[type="checkbox"] { accent-color: #C9A227; }
  input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
  .scrollbar-none::-webkit-scrollbar{ display:none; }
  .scrollbar-none { -ms-overflow-style:none; scrollbar-width:none; }
  button:disabled { opacity: .25; }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }
</style>
</head>

<body class="bg-ink text-paper font-body min-h-screen overflow-x-hidden">

<div id="app" class="min-h-screen flex flex-col max-w-2xl mx-auto relative"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   TRIBUNAL — Mafia Game Master Assistant
   Single-file vanilla JS app. State machine driven by `state.view`.
   ========================================================================= */

/* ---------------------------- State & Storage ---------------------------- */

const STORAGE_KEY = 'tribunal_state_v2';
const SESSION_KEY = 'tribunal_session_v2';

const DEFAULT_ROLES = [
  { id:'villager', name:'Villager', alignment:'town', wakeOrder:0, isPair:false, isBase:true,
    description:'No special ability. Use the day phase to observe, debate and vote out threats.' },
  { id:'mafia', name:'Mafia', alignment:'mafia', wakeOrder:3, isPair:false, isBase:true, teamSize:2,
    description:'Wakes each night with fellow Mafia to choose one player to eliminate.' },
  { id:'doctor', name:'Doctor', alignment:'town', wakeOrder:2, isPair:false, isBase:false, maxCount:1, probability:100,
    description:'Wakes each night to protect one player from elimination.' },
  { id:'sheriff', name:'Sheriff', alignment:'town', wakeOrder:1, isPair:false, isBase:false, maxCount:1, probability:100,
    description:'Wakes each night to investigate one player and learn their alignment.' },
  { id:'jester', name:'Jester', alignment:'neutral', wakeOrder:0, isPair:false, isBase:false, maxCount:1, probability:20,
    description:'Wins alone if voted out by the town during a day phase.' },
  { id:'lovers', name:'Lovers', alignment:'neutral', wakeOrder:0, isPair:true, isBase:false, maxCount:2, probability:25,
    description:'Two secretly bound players. If one dies, the other dies of grief.' },
];

/**
 * Migrates a role saved under the old schema (minCount/maxCount/weight) into the
 * new Among-Us-style schema (isBase + teamSize, or maxCount "Number" + probability %).
 */
function migrateRole(r) {
  if (r.probability !== undefined || r.isBase !== undefined) return r; // already current schema
  if (r.id === 'villager') {
    const { minCount, maxCount, weight, ...rest } = r;
    return { ...rest, isBase:true, alignment:'town' };
  }
  if (r.id === 'mafia') {
    const teamSize = (r.minCount && r.minCount > 0) ? r.minCount : 2;
    const { minCount, maxCount, weight, ...rest } = r;
    return { ...rest, isBase:true, alignment:'mafia', teamSize };
  }
  const maxCount = (r.maxCount == null) ? 1 : r.maxCount;
  const probability = Math.max(0, Math.min(100, r.weight != null ? r.weight : 50));
  const { minCount, weight, ...rest } = r;
  return { ...rest, isBase:false, maxCount, probability };
}
function ensureBaseRoles(roles) {
  if (!roles.some(r => r.isBase && r.alignment === 'mafia')) {
    roles.unshift(structuredClone(DEFAULT_ROLES.find(r => r.id === 'mafia')));
  }
  if (!roles.some(r => r.isBase && r.alignment === 'town')) {
    roles.unshift(structuredClone(DEFAULT_ROLES.find(r => r.id === 'villager')));
  }
  return roles;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const wasOldSchema = parsed.roles && parsed.roles.length && parsed.roles[0].probability === undefined && parsed.roles[0].isBase === undefined;
      parsed.roles = ensureBaseRoles((parsed.roles && parsed.roles.length ? parsed.roles : structuredClone(DEFAULT_ROLES)).map(migrateRole));
      parsed.presets = wasOldSchema ? [] : (parsed.presets || []); // old preset snapshots use an incompatible shape
      parsed.playerNameMemory = parsed.playerNameMemory || [];
      parsed.settings = parsed.settings || {};
      if (parsed.settings.teammateAwareness === undefined) parsed.settings.teammateAwareness = true;
      if (parsed.settings.gmPassword === undefined) parsed.settings.gmPassword = '1234';
      if (parsed.settings.shuffleTurnOrder === undefined) parsed.settings.shuffleTurnOrder = true;
      delete parsed.settings.alignmentQuotas;
      parsed.stats = parsed.stats || { gamesPlayed:0, lastPlayerCount:0 };
      return parsed;
    }
  } catch(e) { console.warn('state load failed', e); }
  return {
    roles: structuredClone(DEFAULT_ROLES),
    presets: [],
    playerNameMemory: [],
    settings: { teammateAwareness:true, gmPassword:'1234', shuffleTurnOrder:true },
    stats: { gamesPlayed:0, lastPlayerCount:0 },
  };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      players: session.players,
      passIndex: session.passIndex,
      timer: { seconds: session.timer.seconds, remaining: session.timer.remaining },
    }));
  } catch(e) { console.warn('session save failed', e); }
}
function loadSessionFromStorage() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      session.players = p.players || [];
      session.passIndex = Math.min(p.passIndex || 0, session.players.length);
      if (p.timer) { session.timer.seconds = p.timer.seconds || 300; session.timer.remaining = p.timer.remaining ?? session.timer.seconds; }
    }
  } catch(e) { console.warn('session load failed', e); }
}
function clearSessionStorage() { localStorage.removeItem(SESSION_KEY); }

let state = loadState();

/* Runtime (mostly non-persisted, but players/timer mirrored to storage) */
let session = {
  view: 'menu',
  players: [],
  passIndex: 0,
  passRevealed: false,
  timer: { seconds: 300, remaining: 300, running:false, intervalId:null },
  peer: null, hostConn: {}, clientConn: null, roomCode: null, isHost:false,
  onlinePlayers: [],
  gmUnlocked: false,
};
loadSessionFromStorage();

// If this page was opened via a "Show QR Code" scan (?join=CODE), jump straight to the Join screen
const __urlParams = new URLSearchParams(location.search);
const prefillJoinCode = (__urlParams.get('join') || '').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
if (prefillJoinCode) {
  session.view = 'onlineClient';
  history.replaceState({}, '', location.pathname);
}
let showHostQR = false;

/* ------------------------------ Utilities -------------------------------- */

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function $(sel, root=document) { return root.querySelector(sel); }
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function alignColor(alignment) { return { mafia:'mafia', town:'town', neutral:'neutral' }[alignment] || 'gold'; }
function alignLabel(alignment) { return { mafia:'MAFIA', town:'TOWN', neutral:'NEUTRAL' }[alignment] || alignment.toUpperCase(); }
function roleById(id) { return state.roles.find(r => r.id === id); }
function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let code = '';
  for (let i=0;i<4;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function showModal(contentHTML, opts={}) {
  const root = $('#modalRoot');
  root.innerHTML = '';
  const overlay = el(`
    <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
      <div class="bg-panel border border-hairline rounded-2xl max-w-sm w-full p-6 shadow-2xl">${contentHTML}</div>
    </div>`);
  root.appendChild(overlay);
  if (opts.closeOnBackdrop !== false) overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  return overlay;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function errorModal(title, message) {
  showModal(`
    <div class="flex items-start gap-3 mb-3">
      <div class="w-9 h-9 rounded-full bg-mafiaDim flex items-center justify-center text-mafia text-lg font-bold shrink-0">!</div>
      <div>
        <h3 class="font-display text-lg text-mafia uppercase tracking-wide">${title}</h3>
        <p class="text-sm text-paper/70 mt-1">${message}</p>
      </div>
    </div>
    <button onclick="closeModal()" class="btn-press mt-2 w-full py-3 rounded-xl bg-panel2 border border-hairline text-paper font-medium">Understood</button>
  `);
}

/* ------------------------------ Render Root ------------------------------- */

function render() {
  const app = $('#app');
  app.innerHTML = '';
  const viewMap = {
    menu: renderMenu, settings: renderSettings, roleEditor: renderRoleEditor,
    localSetup: renderLocalSetup, passPlay: renderPassPlay,
    gmGate: renderGmGate, gmDashboard: renderGmDashboard,
    onlineMenu: renderOnlineMenu, onlineHost: renderOnlineHost, onlineClient: renderOnlineClient,
    onlineClientWait: renderOnlineClientWait, onlineClientRole: renderOnlineClientRole,
  };
  const fn = viewMap[session.view] || renderMenu;
  const node = el(`<div class="view flex-1 flex flex-col"></div>`);
  app.appendChild(node);
  fn(node);
}
function goto(view) { session.view = view; render(); window.scrollTo(0,0); }

function topBar(title, opts={}) {
  return `
  <div class="flex items-center justify-between px-5 pt-6 pb-4 sticky top-0 bg-ink/95 backdrop-blur z-10 border-b border-hairline">
    <button onclick="${opts.back || "goto('menu')"}" class="w-10 h-10 rounded-full bg-panel2 border border-hairline flex items-center justify-center text-paper/80 active:scale-95">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="font-display text-xl uppercase tracking-widest text-paper">${title}</h1>
    <div class="w-10 h-10">${opts.right || ''}</div>
  </div>`;
}

/* ================================ MAIN MENU ================================ */

function renderMenu(root) {
  root.innerHTML = `
    <div class="flex-1 flex flex-col justify-center px-6 py-10">
      <div class="text-center mb-10">
        <div class="mx-auto w-16 h-16 rounded-full bg-panel2 border border-goldDim seal flex items-center justify-center mb-4">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2l7 4v6c0 5-3.4 8.4-7 10-3.6-1.6-7-5-7-10V6l7-4z" stroke="#C9A227" stroke-width="1.6"/></svg>
        </div>
        <p class="case-stamp text-gold/60 text-xs mb-1">CASE FILE №${String(state.stats.gamesPlayed).padStart(3,'0')}</p>
        <h1 class="font-display text-4xl uppercase tracking-widest">Tribunal</h1>
        <p class="text-paper/50 text-sm mt-2">Mafia role distributor &amp; game master assistant</p>
      </div>
      <div class="flex flex-col gap-3">
        ${menuBtn('Local Play', 'Pass-and-play on one device', "goto('localSetup')", 'gold')}
        ${menuBtn('Online / Co-op', 'Distribute roles across devices', "goto('onlineMenu')", 'town')}
        ${menuBtn('Game Master Dashboard', 'Moderate a live game', "goto('gmGate')", 'mafia')}
        ${menuBtn('Settings', 'Roles, quotas, presets', "goto('settings')", 'neutral')}
      </div>
    </div>
    <div class="px-6 pb-6 text-center text-paper/30 text-xs">
      ${state.roles.length} roles configured · ${state.stats.gamesPlayed} games run
      ${session.players.length ? `<br><button onclick="goto('gmGate')" class="text-gold underline mt-1 inline-block">Resume game in progress (${session.players.length} players)</button>` : ''}
    </div>
  `;
}
function menuBtn(title, sub, onclick, accent) {
  return `
  <button onclick="${onclick}" class="btn-press text-left bg-panel border border-hairline hover:border-${accent}/50 rounded-2xl px-5 py-4 flex items-center gap-4 transition-colors">
    <div class="w-2 h-10 rounded-full bg-${accent}"></div>
    <div class="flex-1">
      <div class="font-display text-lg uppercase tracking-wide">${title}</div>
      <div class="text-paper/50 text-sm">${sub}</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="text-paper/30"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>`;
}

/* ================================ SETTINGS ================================= */

function renderSettings(root) {
  root.innerHTML = `
    ${topBar('Settings')}
    <div class="flex-1 overflow-y-auto px-5 py-5 space-y-6 pb-24">

      <section>
        <div class="flex items-center justify-between mb-2">
          <h2 class="case-stamp text-gold/70 text-xs">CUSTOM PRESETS</h2>
          <button onclick="saveCurrentPreset()" class="text-gold text-sm font-medium">+ Save Current</button>
        </div>
        <div class="space-y-2">
          ${state.presets.length === 0 ? `<p class="text-paper/30 text-sm">No saved presets yet. Configure roles below, then tap "Save Current".</p>` :
            state.presets.map(p => `
            <div class="bg-panel border border-hairline rounded-xl px-4 py-3 flex items-center gap-2 flex-wrap">
              <div class="flex-1 min-w-[100px]">
                <div class="font-medium truncate">${p.name}</div>
                <div class="text-paper/40 text-xs">${p.snapshot.roles.length} roles saved</div>
              </div>
              <button onclick="loadPreset('${p.id}')" class="px-3 py-1.5 rounded-lg bg-gold text-ink text-xs font-semibold">Load</button>
              <button onclick="renamePreset('${p.id}')" class="px-3 py-1.5 rounded-lg bg-panel2 border border-hairline text-xs">Rename</button>
              <button onclick="deletePreset('${p.id}')" class="px-3 py-1.5 rounded-lg bg-mafiaDim border border-mafia text-mafia text-xs">Delete</button>
            </div>`).join('')}
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-2">
          <h2 class="case-stamp text-gold/70 text-xs">ROLES (${state.roles.length})</h2>
          <div class="flex items-center gap-3">
            <button onclick="toggleRoleSelectMode()" class="text-paper/50 text-sm font-medium">${roleSelectMode ? 'Cancel' : 'Select'}</button>
            <button onclick="openRoleEditor(null)" class="text-gold text-sm font-medium">+ Add Role</button>
          </div>
        </div>
        <p class="text-paper/40 text-xs mb-2">Villager and Mafia are your two base roles — anyone who doesn't get a special role becomes one of these. Every other role has a Number (max in the game) and a Probability (% chance for each eligible player).</p>
        ${roleSelectMode ? `
        <button onclick="exportSelectedRoles()" class="btn-press w-full mb-2 py-2.5 rounded-xl bg-gold text-ink text-sm font-semibold" ${selectedRoleIds.size===0 ? 'disabled' : ''}>
          Share Selected (${selectedRoleIds.size})
        </button>` : ''}
        <div class="space-y-2">
          ${state.roles.map(r => roleRow(r)).join('')}
        </div>
      </section>

      <section>
        <h2 class="case-stamp text-gold/70 text-xs mb-2">SHARE ROLES</h2>
        <p class="text-paper/40 text-xs mb-2">To share your whole setup, tap "Select" above and select every role. To grab someone else's roles, paste what they sent you below.</p>
        <button onclick="openImportModal()" class="btn-press w-full py-3 rounded-xl bg-panel border border-hairline text-sm font-medium">Import Roles</button>
      </section>

      <section class="space-y-3">
        <h2 class="case-stamp text-gold/70 text-xs mb-1">RULES</h2>
        <label class="flex items-center justify-between bg-panel border border-hairline rounded-xl px-4 py-3">
          <div>
            <div class="font-medium text-sm">Teammate Awareness</div>
            <div class="text-paper/40 text-xs">Same-team &amp; pair roles see each other's names</div>
          </div>
          <input type="checkbox" class="w-5 h-5" ${state.settings.teammateAwareness ? 'checked' : ''} onchange="state.settings.teammateAwareness=this.checked; saveState()">
        </label>
        <label class="flex items-center justify-between bg-panel border border-hairline rounded-xl px-4 py-3">
          <div>
            <div class="font-medium text-sm">Shuffle Turn Order</div>
            <div class="text-paper/40 text-xs">Default for pass-and-play sequence</div>
          </div>
          <input type="checkbox" class="w-5 h-5" ${state.settings.shuffleTurnOrder ? 'checked' : ''} onchange="state.settings.shuffleTurnOrder=this.checked; saveState()">
        </label>
        <label class="flex items-center justify-between bg-panel border border-hairline rounded-xl px-4 py-3">
          <div>
            <div class="font-medium text-sm">GM Dashboard Password</div>
            <div class="text-paper/40 text-xs">Required to view the host summary</div>

          </div>
          <input type="text" value="${state.settings.gmPassword}" class="w-24 bg-panel2 border border-hairline rounded-lg px-2 py-1 text-center font-mono text-sm" onchange="state.settings.gmPassword=this.value; saveState()">
        </label>
      </section>

      <button onclick="resetRolesToDefault()" class="text-paper/30 text-xs underline mx-auto block pt-2">Restore default role set</button>
    </div>
  `;
}

let roleSelectMode = false;
let selectedRoleIds = new Set();
function toggleRoleSelectMode() { roleSelectMode = !roleSelectMode; selectedRoleIds = new Set(); render(); }
function toggleRoleSelected(id) {
  if (selectedRoleIds.has(id)) selectedRoleIds.delete(id); else selectedRoleIds.add(id);
  render();
}

function roleRow(r) {
  const c = alignColor(r.alignment);

  if (roleSelectMode) {
    const checked = selectedRoleIds.has(r.id);
    return `
    <button onclick="toggleRoleSelected('${r.id}')" class="btn-press w-full bg-panel border ${checked ? 'border-gold' : 'border-hairline'} rounded-xl px-4 py-3 flex items-center gap-3 text-left">
      <input type="checkbox" class="w-5 h-5 pointer-events-none" ${checked ? 'checked' : ''}>
      <span class="w-2.5 h-2.5 rounded-full bg-${c} shrink-0"></span>
      <div class="flex-1 min-w-0">
        <div class="font-medium truncate">${r.name}</div>
        <div class="text-paper/40 text-xs truncate">${alignLabel(r.alignment)}</div>
      </div>
    </button>`;
  }

  let detail;
  if (r.isBase && r.alignment === 'mafia') detail = `Team size: ${r.teamSize}`;
  else if (r.isBase) detail = `Base role — fills every remaining slot`;
  else detail = `Number ${r.maxCount} · ${r.probability}% chance`;

  return `
  <button onclick="openRoleEditor('${r.id}')" class="btn-press w-full bg-panel border border-hairline rounded-xl px-4 py-3 flex items-center gap-3 text-left">
    <span class="text-[10px] font-mono w-6 text-paper/40">${r.wakeOrder > 0 ? '#'+r.wakeOrder : '—'}</span>
    <span class="w-2.5 h-2.5 rounded-full bg-${c} shrink-0"></span>
    <div class="flex-1 min-w-0">
      <div class="font-medium truncate">${r.name} ${r.isPair ? '<span class="text-[10px] text-gold/70 border border-goldDim rounded px-1 ml-1 align-middle">PAIR</span>' : ''} ${r.isBase ? '<span class="text-[10px] text-paper/50 border border-hairline rounded px-1 ml-1 align-middle">BASE</span>' : ''}</div>
      <div class="text-paper/40 text-xs truncate">${alignLabel(r.alignment)} · ${detail}</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-paper/30 shrink-0"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>`;
}

function resetRolesToDefault() {
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2 text-mafia">Restore defaults?</h3>
    <p class="text-sm text-paper/60 mb-4">This replaces your custom role list with the six built-in roles. Presets are kept.</p>
    <div class="flex gap-2">
      <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-panel2 border border-hairline">Cancel</button>
      <button onclick="state.roles=structuredClone(DEFAULT_ROLES); saveState(); closeModal(); render();" class="flex-1 py-3 rounded-xl bg-mafia text-white font-semibold">Restore</button>
    </div>
  `);
}

/* ------------------------------- Presets ----------------------------------- */

function saveCurrentPreset() {
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2">Save preset</h3>
    <p class="text-sm text-paper/60 mb-4">Captures the Mafia team size plus every special role's Number and Probability.</p>
    <input id="presetNameInput" placeholder="Preset name" class="w-full bg-panel2 border border-hairline rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-gold">
    <button onclick="confirmSavePreset()" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Save</button>
  `);
}
function confirmSavePreset() {
  const name = $('#presetNameInput').value.trim();
  if (!name) { errorModal('Missing name', 'Give your preset a name.'); return; }
  const snapshot = {
    roles: state.roles.map(r => ({ id:r.id, teamSize:r.teamSize, maxCount:r.maxCount, probability:r.probability })),
  };
  state.presets.push({ id:'preset-'+Date.now().toString(36), name, snapshot });
  saveState();
  closeModal();
  render();
}
function loadPreset(id) {
  const p = state.presets.find(x => x.id === id);
  if (!p) return;
  p.snapshot.roles.forEach(sr => {

function showExportModal(title, jsonText) {

function copyExportText() {
  const ta = document.getElementById('exportTextarea');
  ta.select();
  const finish = () => {
    const btn = document.getElementById('copyExportBtn');
    if (btn) { const old = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => { if(btn) btn.textContent = old; }, 1500); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(__exportText).then(finish).catch(() => { try { document.execCommand('copy'); finish(); } catch(e){} });
  } else {
    try { document.execCommand('copy'); finish(); } catch(e){}
  }
}
function downloadExportText(filename) {
  const blob = new Blob([__exportText], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

  `);

function confirmImport() {
  const raw = ($('#importTextarea').value || '').trim();
  if (!raw) { errorModal('Nothing to import', 'Paste some exported text first.'); return; }
  let data;
  try { data = JSON.parse(raw); } catch(e) { errorModal('Invalid data', "That doesn't look like valid exported text."); return; }

  let importedRoles = [];
  if (data && data.type === 'tribunal-roles' && Array.isArray(data.roles)) importedRoles = data.roles;
  else if (Array.isArray(data)) importedRoles = data;
  else { errorModal('Unrecognized format', "This text doesn't match a Tribunal role export."); return; }

  let added = 0;
  importedRoles.forEach(r => {
    if (!r || !r.name) return;
    const clone = { ...r };
    const existingIds = new Set(state.roles.map(x => x.id));
    if (!clone.id || existingIds.has(clone.id)) {
      clone.id = clone.name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now().toString(36) + Math.floor(Math.random()*1000);
    }
    clone.alignment = ['town','mafia','neutral'].includes(clone.alignment) ? clone.alignment : 'town';
    clone.wakeOrder = parseInt(clone.wakeOrder) || 0;
    clone.isPair = !!clone.isPair;

    clone.maxCount = Math.max(1, parseInt(clone.maxCount) || 1);

    clone.probability = Math.max(0, Math.min(100, parseInt(clone.probability) ?? 50));

/* ============================ GAME ENGINE ================================= */

/**
 * Assigns roles to a list of player names.
 * Respects: guaranteed minimums, per-role max counts, pair enforcement,
 * alignment-wide quotas, playability (>=1 mafia, >=1 town), and villager fallback.
 */
function assignRoles(playerNames) {
  const total = playerNames.length;
  const roles = state.roles;

  const mafiaBase = roles.find(r => r.isBase && r.alignment === 'mafia');
  const townBase = roles.find(r => r.isBase && r.alignment === 'town');
  if (!mafiaBase || !townBase) {
    return { error: 'Your role list needs one base Mafia role and one base Town role (like Villager) to generate a game. Check Settings → Roles.' };
  }
  const mafiaTeamSize = Math.max(1, mafiaBase.teamSize || 1);
  if (mafiaTeamSize >= total) {
    return { error: `Mafia team size (${mafiaTeamSize}) leaves no room for any Town players out of ${total} total. Lower it on the ${mafiaBase.name} role.` };
  }

  // Split players into a Mafia pool and a Town pool up front — mirrors Among Us's Impostor count
  const order = shuffleArr(playerNames.map((_, i) => i));
  const mafiaPool = order.slice(0, mafiaTeamSize);
  const townPool = order.slice(mafiaTeamSize); // Town + Neutral special roles are drawn from here

  const resultRoleId = new Array(total).fill(null);

  // Rolls each eligible special role independently against its own Probability, up to its own Number cap,
  // for every open slot in the given pool. Anyone left unassigned gets the pool's base/fallback role.
  function rollSpecialRoles(alignments, poolIndices, baseRole) {
    const specials = shuffleArr(roles.filter(r => !r.isBase && alignments.includes(r.alignment) && r.probability > 0 && r.maxCount > 0));
    let unassigned = poolIndices.slice();

    specials.forEach(role => {
      let assignedCount = 0;
      const slotsToTry = shuffleArr(unassigned);
      for (const idx of slotsToTry) {
        if (assignedCount >= role.maxCount) break;
        if (resultRoleId[idx] !== null) continue; // already taken by a previously-rolled role this pass

        if (role.isPair) {
          if (assignedCount + 2 > role.maxCount) continue;
          const partnerCandidates = unassigned.filter(j => j !== idx && resultRoleId[j] === null);
          if (partnerCandidates.length === 0) continue;
          if (Math.random() * 100 < role.probability) {
            const partner = partnerCandidates[Math.floor(Math.random() * partnerCandidates.length)];
            resultRoleId[idx] = role.id;
            resultRoleId[partner] = role.id;
            assignedCount += 2;
          }
        } else {
          if (Math.random() * 100 < role.probability) {
            resultRoleId[idx] = role.id;
            assignedCount += 1;
          }
        }
      }
      unassigned = unassigned.filter(j => resultRoleId[j] === null);
    });

    unassigned.forEach(idx => { resultRoleId[idx] = baseRole.id; });
  }

  rollSpecialRoles(['mafia'], mafiaPool, mafiaBase);
  rollSpecialRoles(['town','neutral'], townPool, townBase); // Neutral roles are drawn from the Town-side pool

  const players = playerNames.map((name, i) => ({ name, roleId: resultRoleId[i], alive:true, notes:'' }));
  return { error:null, players };
}

function teammatesFor(player, allPlayers) {
  if (!state.settings.teammateAwareness) return [];
  const role = roleById(player.roleId);
  if (!role) return [];
  if (role.isPair) return allPlayers.filter(p => p !== player && p.roleId === player.roleId).map(p => p.name);
  if (role.alignment === 'mafia') return allPlayers.filter(p => p !== player && roleById(p.roleId) && roleById(p.roleId).alignment === 'mafia').map(p => p.name);
  return [];
}

function startLocalGame() {
  const shuffle = $('#shuffleToggle').checked;

  if (shuffle) players = shuffleArr(players);
  session.players = players;
  session.passIndex = 0;
  session.passRevealed = false;
  state.stats.gamesPlayed++;
  state.stats.lastPlayerCount = names.length;
  saveState();
  saveSession();
  goto('passPlay');

/* ============================ PASS & PLAY =================================== */

function renderPassPlay(root) {
  if (session.passIndex >= session.players.length) {
    root.innerHTML = `
      <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">

          <button onclick="goto('menu')" class="btn-press py-4 rounded-xl bg-panel2 border border-hairline">Back to Menu</button>
        </div>
      </div>`;
    return;
  }

  const player = session.players[session.passIndex];
  const role = roleById(player.roleId);
  const c = alignColor(role.alignment);
  const teammates = teammatesFor(player, session.players);

  if (!session.passRevealed) {
    root.innerHTML = `
      <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
        <p class="case-stamp text-paper/30 text-xs mb-2">PLAYER ${session.passIndex+1} OF ${session.players.length}</p>
        <h2 class="font-display text-3xl uppercase mb-3">Pass phone to</h2>
        <p class="font-display text-4xl text-gold mb-8">${player.name}</p>
        <button onclick="session.passRevealed=true; render();" class="btn-press w-full max-w-xs py-4 rounded-xl bg-gold text-ink font-display text-lg uppercase tracking-wide mb-8">Reveal My Role</button>

        <div class="w-full max-w-xs">
          <p class="case-stamp text-paper/30 text-xs mb-2">UPCOMING ORDER — REORDER IF SEATS CHANGED</p>
          <div class="space-y-1 max-h-52 overflow-y-auto scrollbar-none">
            ${session.players.slice(session.passIndex).map((p,rel) => {
              const idx = session.passIndex + rel;
              return `
              <div class="flex items-center justify-between bg-panel2 border border-hairline rounded-lg px-3 py-2">
                <span class="text-sm truncate ${rel===0 ? 'text-gold font-semibold' : 'text-paper/60'}">${rel+1}. ${p.name}</span>
                <div class="flex gap-1 shrink-0">
                  <button onclick="movePassOrder(${idx},-1)" ${idx===session.passIndex ? 'disabled' : ''} class="w-7 h-7 rounded bg-panel border border-hairline text-xs">▲</button>
                  <button onclick="movePassOrder(${idx},1)" ${idx===session.players.length-1 ? 'disabled' : ''} class="w-7 h-7 rounded bg-panel border border-hairline text-xs">▼</button>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
  } else {
    root.innerHTML = `
      <div class="flex-1 flex flex-col px-6 py-8">
        <div class="text-center mb-6">
          <p class="case-stamp text-paper/30 text-xs">${player.name.toUpperCase()}'S ROLE</p>
        </div>
        <div class="bg-panel border border-${c}/40 rounded-2xl p-6 flex-1 flex flex-col tab-fold relative overflow-hidden">
          <div class="absolute top-0 right-0 bg-${c} text-ink text-xs font-bold px-3 py-1 rounded-bl-xl case-stamp">${alignLabel(role.alignment)}</div>
          <div class="w-3 h-3 rounded-full bg-${c} mb-3 mt-2"></div>
          <h2 class="font-display text-3xl uppercase text-${c} mb-3">${role.name}</h2>
          <p class="text-paper/70 text-sm leading-relaxed mb-4">${role.description || 'No description provided.'}</p>
          ${role.wakeOrder > 0 ? `<p class="text-xs text-gold/70 case-stamp mb-3">NIGHT ACTION · WAKE ORDER #${role.wakeOrder}</p>` : ''}
          ${teammates.length ? `
            <div class="mt-auto pt-4 border-t border-hairline">
              <p class="text-xs case-stamp text-paper/40 mb-1">${role.isPair ? 'YOUR PARTNER' : 'YOUR TEAM'}</p>
              <p class="text-paper font-medium">${teammates.join(', ')}</p>
            </div>` : ''}
        </div>
        <button onclick="advancePassPlay()" class="btn-press w-full mt-6 py-4 rounded-xl bg-panel2 border border-hairline font-display uppercase tracking-wide">Hide &amp; Pass</button>
      </div>`;
  }
}
function movePassOrder(idx, dir) {
  const target = idx + dir;
  if (target < session.passIndex || target >= session.players.length) return;
  [session.players[idx], session.players[target]] = [session.players[target], session.players[idx]];
  saveSession();
  render();
}
function advancePassPlay() {
  session.passIndex++;
  session.passRevealed = false;
  saveSession();
  render();
}

/* ============================ GM DASHBOARD =================================== */

function renderGmGate(root) {
  if (session.players.length === 0) {
    root.innerHTML = `
      ${topBar('Game Master')}
      <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
        <p class="text-paper/50">No active game found. Start a Local or Online game first, then return here.</p>
      </div>`;
    return;
  }
  root.innerHTML = `
    ${topBar('Game Master')}
    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
      <div class="w-14 h-14 rounded-full bg-panel2 border border-goldDim flex items-center justify-center mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#C9A227" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#C9A227" stroke-width="1.8"/></svg>
      </div>
      <h2 class="font-display text-2xl uppercase mb-2">Host access</h2>
      <p class="text-paper/40 text-sm mb-6">Enter the GM password to view the secret host summary.</p>
      <input id="gmPass" type="password" placeholder="Password" class="w-full max-w-xs bg-panel border border-hairline rounded-xl px-4 py-3 text-center font-mono tracking-widest mb-4 focus:outline-none focus:border-gold">
      <button onclick="checkGmPassword()" class="btn-press w-full max-w-xs py-4 rounded-xl bg-gold text-ink font-display uppercase tracking-wide">Unlock</button>
    </div>`;
}
function checkGmPassword() {
  const val = $('#gmPass').value;
  if (val === state.settings.gmPassword) { session.gmUnlocked = true; goto('gmDashboard'); }
  else errorModal('Incorrect password', 'That password does not match the one set in Settings.');
}

function renderGmDashboard(root) {
  if (!session.gmUnlocked) { goto('gmGate'); return; }
  const players = session.players;
  const nightOrder = players
    .map(p => ({ p, role: roleById(p.roleId) }))
    .filter(x => x.role && x.role.wakeOrder > 0 && x.p.alive)
    .sort((a,b) => a.role.wakeOrder - b.role.wakeOrder);

  root.innerHTML = `
    ${topBar('GM Dashboard', { back: "goto('menu')" })}
    <div class="flex-1 overflow-y-auto px-5 py-5 space-y-6 pb-10">

      <section>
        <h2 class="case-stamp text-gold/70 text-xs mb-2">ROUND TIMER</h2>
        <div class="bg-panel border border-hairline rounded-2xl p-5 flex flex-col items-center">
          <p id="timerDisplay" class="font-mono text-5xl text-gold tracking-wider mb-4">${formatTime(session.timer.remaining)}</p>
          <div class="grid grid-cols-4 gap-2 w-full mb-3">
            <button onclick="timerAdjust(-60)" class="py-2 rounded-lg bg-panel2 border border-hairline text-xs">−1m</button>
            <button onclick="timerAdjust(-30)" class="py-2 rounded-lg bg-panel2 border border-hairline text-xs">−30s</button>
            <button onclick="timerAdjust(30)" class="py-2 rounded-lg bg-panel2 border border-hairline text-xs">+30s</button>
            <button onclick="timerAdjust(60)" class="py-2 rounded-lg bg-panel2 border border-hairline text-xs">+1m</button>
          </div>
          <div class="flex gap-2 w-full">
            <button onclick="timerToggle()" class="flex-1 py-3 rounded-xl ${session.timer.running ? 'bg-mafia' : 'bg-town'} text-ink font-semibold">${session.timer.running ? 'Pause' : 'Start'}</button>
            <button onclick="timerReset()" class="flex-1 py-3 rounded-xl bg-panel2 border border-hairline">Reset</button>
            <button onclick="timerEnd()" class="flex-1 py-3 rounded-xl bg-mafiaDim border border-mafia text-mafia font-semibold">End</button>
          </div>
        </div>
      </section>

      <section>
        <h2 class="case-stamp text-gold/70 text-xs mb-2">NIGHT ORDER CHECKLIST</h2>
        <div class="space-y-2">
          ${nightOrder.length === 0 ? `<p class="text-paper/30 text-sm">No living roles with a night action.</p>` :
            nightOrder.map(({p,role}) => `
            <div class="bg-panel border border-hairline rounded-xl px-4 py-3 flex items-center gap-3">
              <span class="font-mono text-gold w-6">${role.wakeOrder}</span>
              <div class="flex-1">
                <div class="font-medium text-sm">${role.name}</div>
                <div class="text-paper/40 text-xs">${p.name}</div>
              </div>
              <span class="w-2.5 h-2.5 rounded-full bg-${alignColor(role.alignment)}"></span>
            </div>`).join('')}
        </div>
      </section>

      <section>
        <h2 class="case-stamp text-gold/70 text-xs mb-2">PLAYERS &amp; SECRET ROLES</h2>
        <div class="space-y-2">
          ${players.map((p,i) => {
            const role = roleById(p.roleId);
            const c = alignColor(role.alignment);
            return `
            <div class="bg-panel border border-hairline rounded-xl px-4 py-3 ${p.alive ? '' : 'opacity-50'}">
              <div class="flex items-center gap-3">
                <span class="w-2.5 h-2.5 rounded-full bg-${c} shrink-0"></span>
                <div class="flex-1 min-w-0">
                  <div class="font-medium truncate">${p.name} ${!p.alive ? '<span class="text-mafia text-xs">(dead)</span>' : ''}</div>
                  <div class="text-paper/40 text-xs">${role.name} · ${alignLabel(role.alignment)}</div>
                </div>
                <button onclick="togglePlayerAlive(${i})" class="btn-press px-3 py-1.5 rounded-lg text-xs font-semibold ${p.alive ? 'bg-mafiaDim text-mafia border border-mafia' : 'bg-townDim text-town border border-town'}">
                  ${p.alive ? 'Mark Dead' : 'Revive'}
                </button>
              </div>
              <input placeholder="Death note (optional)" value="${p.notes || ''}" oninput="updatePlayerNotes(${i}, this.value)" class="mt-2 w-full bg-panel2 border border-hairline rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-gold">
            </div>`;
          }).join('')}
        </div>
      </section>

      <button onclick="endGame()" class="w-full py-3 rounded-xl bg-mafiaDim border border-mafia text-mafia font-medium">End Game &amp; Return to Menu</button>
    </div>
  `;
}
function togglePlayerAlive(i) { session.players[i].alive = !session.players[i].alive; saveSession(); render(); }
function updatePlayerNotes(i, val) { session.players[i].notes = val; saveSession(); }
function endGame() {
  stopTimerInterval();
  session.players = [];
  session.gmUnlocked = false;
  clearSessionStorage();
  goto('menu');
}

function formatTime(sec) {
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function timerToggle() {
  if (session.timer.running) {
    stopTimerInterval();
  } else {
    session.timer.running = true;
    session.timer.intervalId = setInterval(() => {
      if (session.timer.remaining > 0) {
        session.timer.remaining--;
        const d = $('#timerDisplay');
        if (d) d.textContent = formatTime(session.timer.remaining);
        if (session.timer.remaining % 5 === 0) saveSession();
      } else {
        stopTimerInterval();
        saveSession();
      }
    }, 1000);
  }
  render();
}
function stopTimerInterval() {
  if (session.timer.intervalId) clearInterval(session.timer.intervalId);
  session.timer.intervalId = null;
  session.timer.running = false;
}
function timerReset() { stopTimerInterval(); session.timer.remaining = session.timer.seconds; saveSession(); render(); }
function timerEnd() { stopTimerInterval(); session.timer.remaining = 0; saveSession(); render(); }
function timerAdjust(d) {
  session.timer.seconds = Math.max(30, session.timer.seconds + d);
  session.timer.remaining = Math.max(0, session.timer.remaining + d);
  saveSession();
  render();
}

/* ============================ ONLINE / CO-OP ================================= */

function renderOnlineMenu(root) {
  root.innerHTML = `
    ${topBar('Online / Co-op')}
    <div class="flex-1 flex flex-col justify-center px-6 gap-4">
      <p class="text-paper/40 text-sm text-center mb-2">Requires an internet connection. One device hosts; others join with a room code.</p>
      <button onclick="goto('onlineHost')" class="btn-press bg-panel border border-hairline hover:border-gold/50 rounded-2xl px-5 py-5 text-left">
        <div class="font-display text-lg uppercase">Host a Game</div>
        <div class="text-paper/50 text-sm">Configure players &amp; distribute roles</div>
      </button>
      <button onclick="goto('onlineClient')" class="btn-press bg-panel border border-hairline hover:border-town/50 rounded-2xl px-5 py-5 text-left">
        <div class="font-display text-lg uppercase">Join a Game</div>
        <div class="text-paper/50 text-sm">Enter a 4-letter room code</div>
      </button>
    </div>
  `;
}

/* --- HOST --- */
function renderOnlineHost(root) {
  if (!session.peer) initHostPeer();
  const joinUrl = location.origin + location.pathname + '?join=' + (session.roomCode || '');
  root.innerHTML = `
    ${topBar('Hosting', { back: "leaveOnline(); goto('onlineMenu');" })}
    <div class="flex-1 overflow-y-auto px-5 py-5 space-y-5 pb-28">
      <div class="text-center bg-panel border border-goldDim rounded-2xl py-6">
        <p class="case-stamp text-paper/40 text-xs mb-1">ROOM CODE</p>
        <p class="font-display text-5xl tracking-[0.3em] text-gold">${session.roomCode || '····'}</p>
        <p class="text-paper/30 text-xs mt-2">${session.peer && session.peer.open ? 'Connected to relay' : 'Connecting…'}</p>
        <button onclick="showHostQR=!showHostQR; render();" class="text-gold text-xs underline mt-3">${showHostQR ? 'Hide' : 'Show'} QR Code (optional)</button>
        ${showHostQR && session.roomCode ? `
          <div class="mt-3 flex flex-col items-center">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(joinUrl)}" alt="QR code to join room ${session.roomCode}" class="rounded-lg border border-hairline bg-paper p-2">
            <p class="text-paper/30 text-[11px] mt-2">Scanning jumps straight to the Join screen with the code filled in — the 4-letter code above still works too.</p>
          </div>` : ''}
      </div>

      <div>
        <h2 class="case-stamp text-gold/70 text-xs mb-2">PLAYERS JOINED (${session.onlinePlayers.length})</h2>
        <div class="space-y-2">
          ${session.onlinePlayers.length === 0 ? `<p class="text-paper/30 text-sm">Waiting for players to join…</p>` :
            session.onlinePlayers.map(p => `
            <div class="bg-panel border border-hairline rounded-xl px-4 py-3 flex items-center justify-between">
              <span class="font-medium">${p.name}</span>
              <span class="text-town text-xs">● online</span>
            </div>`).join('')}
        </div>
      </div>

      <label class="flex items-center justify-between bg-panel border border-hairline rounded-xl px-4 py-3">
        <div>
          <div class="font-medium text-sm">Shuffle Turn Order</div>
          <div class="text-paper/40 text-xs">Cosmetic — for host reference only</div>
        </div>
        <input id="onlineShuffle" type="checkbox" class="w-5 h-5" ${state.settings.shuffleTurnOrder ? 'checked' : ''}>
      </label>
    </div>
    <div class="px-5 py-4 border-t border-hairline sticky bottom-0 bg-ink/95 backdrop-blur">
      <button onclick="distributeOnlineRoles()" class="btn-press w-full py-4 rounded-xl bg-gold text-ink font-display text-lg uppercase tracking-wide" ${session.onlinePlayers.length < 3 ? 'disabled' : ''}>
        ${session.onlinePlayers.length < 3 ? 'Need 3+ players' : 'Distribute Roles'}
      </button>
    </div>
  `;
}

function initHostPeer() {
  session.isHost = true;
  session.roomCode = genRoomCode();
  session.onlinePlayers = [];
  try {
    session.peer = new Peer('mafia-' + session.roomCode);
    session.peer.on('open', () => render());
    session.peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'join') { session.onlinePlayers.push({ name: data.name, conn }); render(); }
      });
      conn.on('close', () => { session.onlinePlayers = session.onlinePlayers.filter(p => p.conn !== conn); render(); });
    });
    session.peer.on('error', (err) => {
      errorModal('Connection error', 'Could not start the online session: ' + err.type + '. Check your internet connection.');
    });
  } catch(e) {
    errorModal('PeerJS unavailable', 'The peer-to-peer library failed to load. Check your internet connection and try again.');
  }
}

function distributeOnlineRoles() {
  const names = session.onlinePlayers.map(p => p.name);
  const result = assignRoles(names);
  if (result.error) { errorModal('Cannot start game', result.error); return; }
  session.players = result.players;
  session.players.forEach(p => {
    const op = session.onlinePlayers.find(o => o.name === p.name);
    const role = roleById(p.roleId);
    const teammates = teammatesFor(p, session.players);
    if (op) op.conn.send({ type:'role', role: { name: role.name, alignment: role.alignment, description: role.description, wakeOrder: role.wakeOrder }, teammates });
  });
  state.stats.gamesPlayed++;
  state.stats.lastPlayerCount = names.length;
  saveState();
  saveSession();
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2 text-town">Roles sent</h3>
    <p class="text-sm text-paper/60 mb-4">Every connected player now has their secret role on their own device.</p>
    <button onclick="closeModal(); goto('gmGate');" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Open GM Dashboard</button>
  `);
}

function leaveOnline() {
  if (session.peer) { try { session.peer.destroy(); } catch(e){} }
  session.peer = null;
  session.roomCode = null;
  session.onlinePlayers = [];
  session.clientConn = null;
  showHostQR = false;
}

/* --- CLIENT --- */
function renderOnlineClient(root) {
  root.innerHTML = `
    ${topBar('Join Game', { back: "goto('onlineMenu')" })}
    <div class="flex-1 flex flex-col justify-center px-6 gap-4">
      <div>
        <label class="text-xs case-stamp text-gold/70">ROOM CODE</label>
        <input id="joinCode" maxlength="4" value="${prefillJoinCode || ''}" placeholder="ABCD" class="mt-1 w-full bg-panel border border-hairline rounded-xl px-4 py-4 text-center font-display text-3xl tracking-[0.3em] uppercase focus:outline-none focus:border-gold">
      </div>
      <div>
        <label class="text-xs case-stamp text-gold/70">YOUR NAME</label>
        <input id="joinName" placeholder="Enter your name" class="mt-1 w-full bg-panel border border-hairline rounded-xl px-4 py-3 focus:outline-none focus:border-gold">
      </div>
      <button onclick="joinOnlineGame()" class="btn-press w-full py-4 rounded-xl bg-town text-ink font-display text-lg uppercase tracking-wide mt-2">Join Room</button>
    </div>
  `;
}
function joinOnlineGame() {
  const code = $('#joinCode').value.trim().toUpperCase();
  const name = $('#joinName').value.trim();
  if (code.length !== 4) { errorModal('Invalid code', 'Room codes are exactly 4 letters.'); return; }
  if (!name) { errorModal('Missing name', 'Please enter your name.'); return; }
  session.isHost = false;
  try {
    session.peer = new Peer();
    session.peer.on('open', () => {
      const conn = session.peer.connect('mafia-' + code);
      session.clientConn = conn;
      conn.on('open', () => { conn.send({ type:'join', name }); goto('onlineClientWait'); });
      conn.on('data', (data) => {
        if (data.type === 'role') { session.myRole = data.role; session.myTeammates = data.teammates || []; goto('onlineClientRole'); }
      });
      conn.on('error', () => errorModal('Connection failed', 'Could not reach that room. Check the code and try again.'));
    });
    session.peer.on('error', (err) => errorModal('Connection error', err.type + '. Check your internet connection.'));
  } catch(e) {
    errorModal('PeerJS unavailable', 'The peer-to-peer library failed to load.');
  }
}
function renderOnlineClientWait(root) {
  root.innerHTML = `
    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
      <div class="w-14 h-14 rounded-full border-2 border-gold/30 border-t-gold animate-spin mb-6"></div>
      <h2 class="font-display text-2xl uppercase mb-2">Waiting for host</h2>
      <p class="text-paper/40 text-sm">Your role will appear automatically once the Game Master distributes roles.</p>
    </div>
  `;
}
function renderOnlineClientRole(root) {
  const role = session.myRole;
  const c = alignColor(role.alignment);
  root.innerHTML = `
    <div class="flex-1 flex flex-col px-6 py-10">
      <div class="bg-panel border border-${c}/40 rounded-2xl p-6 flex-1 flex flex-col tab-fold relative overflow-hidden">
        <div class="absolute top-0 right-0 bg-${c} text-ink text-xs font-bold px-3 py-1 rounded-bl-xl case-stamp">${alignLabel(role.alignment)}</div>
        <div class="w-3 h-3 rounded-full bg-${c} mb-3 mt-2"></div>
        <h2 class="font-display text-3xl uppercase text-${c} mb-3">${role.name}</h2>
        <p class="text-paper/70 text-sm leading-relaxed mb-4">${role.description || 'No description provided.'}</p>
        ${role.wakeOrder > 0 ? `<p class="text-xs text-gold/70 case-stamp mb-3">NIGHT ACTION · WAKE ORDER #${role.wakeOrder}</p>` : ''}
        ${session.myTeammates && session.myTeammates.length ? `
          <div class="mt-auto pt-4 border-t border-hairline">
            <p class="text-xs case-stamp text-paper/40 mb-1">YOUR TEAM</p>
            <p class="text-paper font-medium">${session.myTeammates.join(', ')}</p>
          </div>` : ''}
      </div>
      <p class="text-center text-paper/30 text-xs mt-6">Keep this screen private. Do not show it to other players.</p>
    </div>
  `;
}

/* ================================ Boot ===================================== */
render();

</script>
</body>
</html>
