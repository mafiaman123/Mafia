<body class="bg-ink text-paper font-body min-h-screen overflow-x-hidden">

<div id="app" class="min-h-screen flex flex-col max-w-2xl mx-auto relative"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   TRIBUNAL — Mafia Game Master Assistant
   Single-file vanilla JS app. State machine driven by `state.view`.
   ========================================================================= */

/* ---------------------------- State & Storage ---------------------------- */

const STORAGE_KEY = 'tribunal_state_v2';
const SESSION_KEY = 'tribunal_session_v2';

const DEFAULT_ROLES = [
  { id:'villager', name:'Villager', alignment:'town', wakeOrder:0, isBase:true,
    description:'No special ability. Use the day phase to observe, debate and vote out threats.' },
  { id:'mafia', name:'Mafia', alignment:'mafia', wakeOrder:3, isBase:true, teamSize:2,
    description:'Wakes each night with fellow Mafia to choose one player to eliminate.' },
  { id:'doctor', name:'Doctor', alignment:'town', wakeOrder:2, isBase:false, maxCount:1, probability:100,
    description:'Wakes each night to protect one player from elimination.' },
  { id:'sheriff', name:'Sheriff', alignment:'town', wakeOrder:1, isBase:false, maxCount:1, probability:100,
    description:'Wakes each night to investigate one player and learn their alignment.' },
  { id:'jester', name:'Jester', alignment:'neutral', wakeOrder:0, isBase:false, maxCount:1, probability:20,
    description:'Wins alone if voted out by the town during a day phase.' },
];

/** Secondary Roles ("bonds") layer a shared identity on top of any two (or more) players,
 *  independent of their primary role — e.g. Twins can be one Mafia and one Doctor. */
const DEFAULT_SECONDARY_ROLES = [
  { id:'twins', name:'Twins', description:'Two players secretly know they are twins, no matter what their assigned roles turn out to be.', probability:20, groupSize:2, maxGroups:1 },
];

/**
 * Migrates a role saved under the old schema (minCount/maxCount/weight) into the
 * new Among-Us-style schema (isBase + teamSize, or maxCount "Number" + probability %).
 */
function migrateRole(r) {
  if (r.probability !== undefined || r.isBase !== undefined) return r; // already current schema
  if (r.id === 'villager') {
    const { minCount, maxCount, weight, isPair, ...rest } = r;
    return { ...rest, isBase:true, alignment:'town' };
  }
  if (r.id === 'mafia') {
    const teamSize = (r.minCount && r.minCount > 0) ? r.minCount : 2;
    const { minCount, maxCount, weight, isPair, ...rest } = r;
    return { ...rest, isBase:true, alignment:'mafia', teamSize };
  }
  const maxCount = (r.maxCount == null) ? 1 : r.maxCount;
  const probability = Math.max(0, Math.min(100, r.weight != null ? r.weight : 50));
  const { minCount, weight, isPair, ...rest } = r;
  return { ...rest, isBase:false, maxCount, probability };
}
function ensureBaseRoles(roles) {
  if (!roles.some(r => r.isBase && r.alignment === 'mafia')) {
    roles.unshift(structuredClone(DEFAULT_ROLES.find(r => r.id === 'mafia')));
  }
  if (!roles.some(r => r.isBase && r.alignment === 'town')) {
    roles.unshift(structuredClone(DEFAULT_ROLES.find(r => r.id === 'villager')));
  }
  return roles;
}

/** Pulls any legacy "Pair Role" primary roles (e.g. the old Lovers) out into the new
 *  Secondary Roles system, so existing saves upgrade gracefully instead of losing data. */
function extractLegacyPairRoles(roles, secondaryRoles) {
  const pairRoles = roles.filter(r => r.isPair && !r.isBase);
  const kept = roles.filter(r => !(r.isPair && !r.isBase));
  pairRoles.forEach(r => {
    if (secondaryRoles.some(s => s.id === r.id)) return; // already migrated
    secondaryRoles.push({
      id: r.id, name: r.name, description: r.description || '',
      probability: r.probability != null ? r.probability : 20,
      groupSize: 2,
      maxGroups: r.maxCount ? Math.max(1, Math.floor(r.maxCount / 2)) : 1,
    });
  });
  return kept;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const wasOldSchema = parsed.roles && parsed.roles.length && parsed.roles[0].probability === undefined && parsed.roles[0].isBase === undefined;
      parsed.roles = ensureBaseRoles((parsed.roles && parsed.roles.length ? parsed.roles : structuredClone(DEFAULT_ROLES)).map(migrateRole));
      parsed.presets = wasOldSchema ? [] : (parsed.presets || []); // old preset snapshots use an incompatible shape
      parsed.secondaryRoles = parsed.secondaryRoles || structuredClone(DEFAULT_SECONDARY_ROLES);
      parsed.roles = extractLegacyPairRoles(parsed.roles, parsed.secondaryRoles);
      parsed.playerNameMemory = parsed.playerNameMemory || [];
      parsed.settings = parsed.settings || {};
      if (parsed.settings.teammateAwareness === undefined) parsed.settings.teammateAwareness = true;
      if (parsed.settings.gmPassword === undefined) parsed.settings.gmPassword = '1234';
      if (parsed.settings.shuffleTurnOrder === undefined) parsed.settings.shuffleTurnOrder = true;
      if (parsed.settings.defaultTimerSeconds === undefined) parsed.settings.defaultTimerSeconds = 300;
      delete parsed.settings.alignmentQuotas;
      parsed.stats = parsed.stats || { gamesPlayed:0, lastPlayerCount:0 };
      return parsed;
    }
  } catch(e) { console.warn('state load failed', e); }
  return {
    roles: structuredClone(DEFAULT_ROLES),
    secondaryRoles: structuredClone(DEFAULT_SECONDARY_ROLES),
    presets: [],
    playerNameMemory: [],
    settings: { teammateAwareness:true, gmPassword:'1234', shuffleTurnOrder:true, defaultTimerSeconds:300 },
    stats: { gamesPlayed:0, lastPlayerCount:0 },
  };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      players: session.players,
      passIndex: session.passIndex,
      passRevealed: session.passRevealed,
      timer: { seconds: session.timer.seconds, remaining: session.timer.remaining },
      nightTargets: session.nightTargets,
      nightHistory: session.nightHistory,
      nightNumber: session.nightNumber,
      view: session.view,
      gmUnlocked: session.gmUnlocked,
      hostPlaysAlong: session.hostPlaysAlong,
      hostName: session.hostName,
      hostRole: session.hostRole,
      hostTeammates: session.hostTeammates,
      hostSecondary: session.hostSecondary,
      myRole: session.myRole,
      myTeammates: session.myTeammates,
      mySecondary: session.mySecondary,
    }));
  } catch(e) { console.warn('session save failed', e); }
}
// Views safe to drop the person straight back into on page refresh. Each has its own guard
// below since the data that makes it "resumable" differs (a live P2P connection never does —
// online host/join lobby screens are excluded on purpose since they can't be restored).
function canResumeView(view, p) {
  if (view === 'passPlay' || view === 'gmGate' || view === 'gmDashboard') return (p.players || []).length > 0;
  if (view === 'onlineHostReveal') return !!p.hostRole;
  if (view === 'onlineClientRole') return !!p.myRole;
  return false;
}
function loadSessionFromStorage() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      session.players = p.players || [];
      session.passIndex = Math.min(p.passIndex || 0, session.players.length);
      session.passRevealed = !!p.passRevealed;
      if (p.timer) { session.timer.seconds = p.timer.seconds || 300; session.timer.remaining = p.timer.remaining ?? session.timer.seconds; }
      session.nightTargets = p.nightTargets || {};
      session.nightHistory = p.nightHistory || [];
      session.nightNumber = p.nightNumber || 1;
      session.hostPlaysAlong = !!p.hostPlaysAlong;
      session.hostName = p.hostName || '';
      session.hostRole = p.hostRole || null;
      session.hostTeammates = p.hostTeammates || [];
      session.hostSecondary = p.hostSecondary || null;
      session.myRole = p.myRole || null;
      session.myTeammates = p.myTeammates || [];
      session.mySecondary = p.mySecondary || null;
      if (p.view && canResumeView(p.view, p)) {
        session.view = p.view;
        session.gmUnlocked = !!p.gmUnlocked;
      }
    }
  } catch(e) { console.warn('session load failed', e); }
}
function clearSessionStorage() { localStorage.removeItem(SESSION_KEY); }

let state = loadState();

/* Runtime (mostly non-persisted, but players/timer mirrored to storage) */
let session = {
  view: 'menu',
  players: [],
  passIndex: 0,
  passRevealed: false,
  timer: { seconds: state.settings.defaultTimerSeconds || 300, remaining: state.settings.defaultTimerSeconds || 300, running:false, intervalId:null },
  peer: null, hostConn: {}, clientConn: null, roomCode: null, isHost:false,
  peerStatus: 'connecting', peerError: null, clientStatus: 'connecting', clientError: null,
  onlinePlayers: [],
  hostPlaysAlong: false, hostName: '', hostRole: null, hostTeammates: [], hostSecondary: null,
  mySecondary: null,
  nightTargets: {}, nightHistory: [], nightNumber: 1,
  gmUnlocked: false,
};
loadSessionFromStorage();

// If this page was opened via a "Show QR Code" scan (?join=CODE), jump straight to the Join screen
const __urlParams = new URLSearchParams(location.search);
const prefillJoinCode = (__urlParams.get('join') || '').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
if (prefillJoinCode) {
  session.view = 'onlineClient';
  history.replaceState({}, '', location.pathname);
}
let showHostQR = false;

/* ------------------------------ Utilities -------------------------------- */

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function $(sel, root=document) { return root.querySelector(sel); }
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function alignColor(alignment) { return { mafia:'mafia', town:'town', neutral:'neutral' }[alignment] || 'gold'; }
function alignLabel(alignment) { return { mafia:'MAFIA', town:'TOWN', neutral:'NEUTRAL' }[alignment] || alignment.toUpperCase(); }
function roleById(id) { return state.roles.find(r => r.id === id); }
function secondaryRoleById(id) { return state.secondaryRoles.find(r => r.id === id); }
function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let code = '';
  for (let i=0;i<4;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function showModal(contentHTML, opts={}) {
  const root = $('#modalRoot');
  root.innerHTML = '';
  const overlay = el(`
    <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
      <div class="bg-panel border border-hairline rounded-2xl max-w-sm w-full p-6 shadow-2xl">${contentHTML}</div>
    </div>`);
  root.appendChild(overlay);
  if (opts.closeOnBackdrop !== false) overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  return overlay;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function errorModal(title, message) {
  showModal(`
    <div class="flex items-start gap-3 mb-3">
      <div class="w-9 h-9 rounded-full bg-mafiaDim flex items-center justify-center text-mafia text-lg font-bold shrink-0">!</div>
      <div>
        <h3 class="font-display text-lg text-mafia uppercase tracking-wide">${title}</h3>
        <p class="text-sm text-paper/70 mt-1">${message}</p>
      </div>
    </div>
    <button onclick="closeModal()" class="btn-press mt-2 w-full py-3 rounded-xl bg-panel2 border border-hairline text-paper font-medium">Understood</button>
  `);
}

/* ------------------------------ Render Root ------------------------------- */

function render() {
  const app = $('#app');
  app.innerHTML = '';
  const viewMap = {
    menu: renderMenu, settings: renderSettings, roleEditor: renderRoleEditor, secondaryRoleEditor: renderSecondaryRoleEditor,
    localSetup: renderLocalSetup, passPlay: renderPassPlay,
    gmGate: renderGmGate, gmDashboard: renderGmDashboard,
    onlineMenu: renderOnlineMenu, onlineHost: renderOnlineHost, onlineClient: renderOnlineClient,
    onlineClientWait: renderOnlineClientWait, onlineClientRole: renderOnlineClientRole,
    onlineHostReveal: renderOnlineHostReveal,
  };
  const fn = viewMap[session.view] || renderMenu;
  const node = el(`<div class="view flex-1 flex flex-col"></div>`);
  app.appendChild(node);
  fn(node);
}
function goto(view) { session.view = view; saveSession(); render(); window.scrollTo(0,0); }

function topBar(title, opts={}) {
  return `
  <div class="flex items-center justify-between px-5 pt-6 pb-4 sticky top-0 bg-ink/95 backdrop-blur z-10 border-b border-hairline">
    <button onclick="${opts.back || "goto('menu')"}" class="w-10 h-10 rounded-full bg-panel2 border border-hairline flex items-center justify-center text-paper/80 active:scale-95">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="font-display text-xl uppercase tracking-widest text-paper">${title}</h1>
    <div class="w-10 h-10">${opts.right || ''}</div>
  </div>`;
}

/* ================================ MAIN MENU ================================ */

function renderMenu(root) {
  root.innerHTML = `
    <div class="flex-1 flex flex-col justify-center px-6 py-10">
      <div class="text-center mb-10">
        <div class="mx-auto w-16 h-16 rounded-full bg-panel2 border border-goldDim seal flex items-center justify-center mb-4">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2l7 4v6c0 5-3.4 8.4-7 10-3.6-1.6-7-5-7-10V6l7-4z" stroke="#C9A227" stroke-width="1.6"/></svg>
        </div>
        <p class="case-stamp text-gold/60 text-xs mb-1">CASE FILE №${String(state.stats.gamesPlayed).padStart(3,'0')}</p>
        <h1 class="font-display text-4xl uppercase tracking-widest">Tribunal</h1>
        <p class="text-paper/50 text-sm mt-2">Mafia role distributor &amp; game master assistant</p>
      </div>
      <div class="flex flex-col gap-3">
        ${menuBtn('Local Play', 'Pass-and-play on one device', "goto('localSetup')", 'gold')}
        ${menuBtn('Online / Co-op', 'Distribute roles across devices', "goto('onlineMenu')", 'town')}
        ${menuBtn('Game Master Dashboard', 'Moderate a live game', "goto('gmGate')", 'mafia')}
        ${menuBtn('Settings', 'Roles, quotas, presets', "goto('settings')", 'neutral')}
      </div>
    </div>
    <div class="px-6 pb-6 text-center text-paper/30 text-xs">
      ${state.roles.length} roles configured · ${state.stats.gamesPlayed} games run
      ${session.players.length ? `<br><button onclick="goto('gmGate')" class="text-gold underline mt-1 inline-block">Resume game in progress (${session.players.length} players)</button>` : ''}
    </div>
  `;
}
function menuBtn(title, sub, onclick, accent) {
  return `
  <button onclick="${onclick}" class="btn-press text-left bg-panel border border-hairline hover:border-${accent}/50 rounded-2xl px-5 py-4 flex items-center gap-4 transition-colors">
    <div class="w-2 h-10 rounded-full bg-${accent}"></div>
    <div class="flex-1">
      <div class="font-display text-lg uppercase tracking-wide">${title}</div>
      <div class="text-paper/50 text-sm">${sub}</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="text-paper/30"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>`;
}

/* ================================ SETTINGS ================================= */

function renderSettings(root) {
  root.innerHTML = `
    ${topBar('Settings')}
    <div class="flex-1 overflow-y-auto px-5 py-5 space-y-6 pb-24">

      <section>
        <div class="flex items-center justify-between mb-2">
          <h2 class="case-stamp text-gold/70 text-xs">CUSTOM PRESETS</h2>
          <button onclick="saveCurrentPreset()" class="text-gold text-sm font-medium">+ Save Current</button>
        </div>
        <div class="space-y-2">
          ${state.presets.length === 0 ? `<p class="text-paper/30 text-sm">No saved presets yet. Configure roles below, then tap "Save Current".</p>` :
            state.presets.map(p => `
            <div class="bg-panel border border-hairline rounded-xl px-4 py-3 flex items-center gap-2 flex-wrap">
              <div class="flex-1 min-w-[100px]">
                <div class="font-medium truncate">${p.name}</div>
                <div class="text-paper/40 text-xs">${p.snapshot.roles.length} roles saved</div>
              </div>
              <button onclick="loadPreset('${p.id}')" class="px-3 py-1.5 rounded-lg bg-gold text-ink text-xs font-semibold">Load</button>
              <button onclick="renamePreset('${p.id}')" class="px-3 py-1.5 rounded-lg bg-panel2 border border-hairline text-xs">Rename</button>
              <button onclick="deletePreset('${p.id}')" class="px-3 py-1.5 rounded-lg bg-mafiaDim border border-mafia text-mafia text-xs">Delete</button>
            </div>`).join('')}
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-2">
          <h2 class="case-stamp text-gold/70 text-xs">ROLES (${state.roles.length})</h2>
          <div class="flex items-center gap-3">
            <button onclick="toggleRoleSelectMode()" class="text-paper/50 text-sm font-medium">${roleSelectMode ? 'Cancel' : 'Select'}</button>
            <button onclick="openRoleEditor(null)" class="text-gold text-sm font-medium">+ Add Role</button>
          </div>
        </div>
        <p class="text-paper/40 text-xs mb-2">Villager and Mafia are your two base roles — anyone who doesn't get a special role becomes one of these. Every other role has a Number (max in the game) and a Probability (% chance for each eligible player).</p>
        ${roleSelectMode ? `
        <button onclick="exportSelectedRoles()" class="btn-press w-full mb-2 py-2.5 rounded-xl bg-gold text-ink text-sm font-semibold" ${selectedRoleIds.size===0 ? 'disabled' : ''}>
          Share Selected (${selectedRoleIds.size})
        </button>` : ''}
        <div class="space-y-2">
          ${state.roles.map(r => roleRow(r)).join('')}
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-2">
          <h2 class="case-stamp text-gold/70 text-xs">SECONDARY ROLES (BONDS)</h2>
          <div class="flex items-center gap-3">
            <button onclick="toggleSecondaryRoleSelectMode()" class="text-paper/50 text-sm font-medium">${secondaryRoleSelectMode ? 'Cancel' : 'Select'}</button>
            <button onclick="openSecondaryRoleEditor(null)" class="text-gold text-sm font-medium">+ Add Bond</button>
          </div>
        </div>
        <p class="text-paper/40 text-xs mb-2">A bond layers on top of any two (or more) players regardless of their primary role — one Twin can be Mafia while the other is Doctor. Rolled independently from everything above.</p>
        ${secondaryRoleSelectMode ? `
        <button onclick="exportSelectedSecondaryRoles()" class="btn-press w-full mb-2 py-2.5 rounded-xl bg-gold text-ink text-sm font-semibold" ${selectedSecondaryRoleIds.size===0 ? 'disabled' : ''}>
          Share Selected (${selectedSecondaryRoleIds.size})
        </button>` : ''}
        <div class="space-y-2">
          ${state.secondaryRoles.length === 0 ? `<p class="text-paper/30 text-sm">No bonds configured. Twins were removed as a primary role — add it back here, or make your own.</p>` :
            state.secondaryRoles.map(s => secondaryRoleRow(s)).join('')}
        </div>
      </section>

      <section>
        <h2 class="case-stamp text-gold/70 text-xs mb-2">IMPORT</h2>
        <p class="text-paper/40 text-xs mb-2">To share your roles or bonds, tap "Select" in either section above. To grab something someone sent you, paste it below.</p>
        <button onclick="openImportModal()" class="btn-press w-full py-3 rounded-xl bg-panel border border-hairline text-sm font-medium">Import</button>
      </section>

      <section class="space-y-3">
        <h2 class="case-stamp text-gold/70 text-xs mb-1">RULES</h2>
        <label class="flex items-center justify-between bg-panel border border-hairline rounded-xl px-4 py-3">
          <div>
            <div class="font-medium text-sm">Teammate Awareness</div>
            <div class="text-paper/40 text-xs">Same-team &amp; pair roles see each other's names</div>
          </div>
          <input type="checkbox" class="w-5 h-5" ${state.settings.teammateAwareness ? 'checked' : ''} onchange="state.settings.teammateAwareness=this.checked; saveState()">
        </label>
        <label class="flex items-center justify-between bg-panel border border-hairline rounded-xl px-4 py-3">
          <div>
            <div class="font-medium text-sm">Shuffle Turn Order</div>
            <div class="text-paper/40 text-xs">Default for pass-and-play sequence</div>
          </div>
          <input type="checkbox" class="w-5 h-5" ${state.settings.shuffleTurnOrder ? 'checked' : ''} onchange="state.settings.shuffleTurnOrder=this.checked; saveState()">
        </label>

function saveCurrentPreset() {
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2">Save preset</h3>
    <p class="text-sm text-paper/60 mb-4">Captures the Mafia team size, every special role's Number/Probability, and every bond's settings.</p>
    <input id="presetNameInput" placeholder="Preset name" class="w-full bg-panel2 border border-hairline rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-gold">
    <button onclick="confirmSavePreset()" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Save</button>
  `);
}
function confirmSavePreset() {
  const name = $('#presetNameInput').value.trim();
  if (!name) { errorModal('Missing name', 'Give your preset a name.'); return; }
  const snapshot = {
    roles: state.roles.map(r => ({ id:r.id, teamSize:r.teamSize, maxCount:r.maxCount, probability:r.probability })),
    secondaryRoles: state.secondaryRoles.map(s => ({ id:s.id, probability:s.probability, groupSize:s.groupSize, maxGroups:s.maxGroups })),
  };
  state.presets.push({ id:'preset-'+Date.now().toString(36), name, snapshot });
  saveState();
  closeModal();
  render();
}
function loadPreset(id) {
  const p = state.presets.find(x => x.id === id);
  if (!p) return;
  p.snapshot.roles.forEach(sr => {
    const role = roleById(sr.id);
    if (!role) return;
    if (role.isBase && role.alignment === 'mafia' && sr.teamSize != null) role.teamSize = sr.teamSize;
    if (!role.isBase) { if (sr.maxCount != null) role.maxCount = sr.maxCount; if (sr.probability != null) role.probability = sr.probability; }
  });
  (p.snapshot.secondaryRoles || []).forEach(ss => {
    const sec = secondaryRoleById(ss.id);
    if (!sec) return;
    if (ss.probability != null) sec.probability = ss.probability;
    if (ss.groupSize != null) sec.groupSize = ss.groupSize;
    if (ss.maxGroups != null) sec.maxGroups = ss.maxGroups;
  });
  saveState();
  render();
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2">${p.name} loaded</h3>
    <p class="text-sm text-paper/60 mb-4">Mafia team size, role probabilities and bond settings updated.</p>
    <button onclick="closeModal()" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Got it</button>
  `);
}
function renamePreset(id) {
  const p = state.presets.find(x => x.id === id);
  if (!p) return;
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2">Rename preset</h3>
    <input id="presetRenameInput" value="${p.name}" class="w-full bg-panel2 border border-hairline rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-gold">
    <button onclick="confirmRenamePreset('${id}')" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Save</button>
  `);
}
function confirmRenamePreset(id) {
  const p = state.presets.find(x => x.id === id);
  const val = $('#presetRenameInput').value.trim();
  if (!val) { errorModal('Missing name', 'Preset needs a name.'); return; }
  p.name = val; saveState(); closeModal(); render();
}
function deletePreset(id) {
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2 text-mafia">Delete preset?</h3>
    <p class="text-sm text-paper/60 mb-4">This can't be undone.</p>

/* -------------------------- Share / Export / Import ------------------------- */

let __exportText = '';

function showExportModal(title, jsonText) {
  __exportText = jsonText;
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2">${title}</h3>
    <p class="text-sm text-paper/60 mb-3">Copy this text and send it to another Tribunal user — they paste it under Settings → Import.</p>
    <textarea id="exportTextarea" readonly class="w-full h-40 bg-panel2 border border-hairline rounded-xl px-3 py-2 text-xs font-mono mb-3" onclick="this.select()">${jsonText.replace(/</g,'&lt;')}</textarea>
    <div class="flex gap-2 mb-2">
      <button id="copyExportBtn" onclick="copyExportText()" class="flex-1 py-3 rounded-xl bg-gold text-ink font-semibold">Copy to Clipboard</button>
      <button onclick="downloadExportText('${title.toLowerCase().replace(/[^a-z0-9]+/g,'-')}')" class="flex-1 py-3 rounded-xl bg-panel2 border border-hairline font-medium">Download</button>
    </div>
    <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-panel2 border border-hairline">Close</button>
  `);
}
function copyExportText() {
  const ta = document.getElementById('exportTextarea');
  ta.select();
  const finish = () => {
    const btn = document.getElementById('copyExportBtn');
    if (btn) { const old = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => { if(btn) btn.textContent = old; }, 1500); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(__exportText).then(finish).catch(() => { try { document.execCommand('copy'); finish(); } catch(e){} });
  } else {
    try { document.execCommand('copy'); finish(); } catch(e){}
  }
}
function downloadExportText(filename) {
  const blob = new Blob([__exportText], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportSelectedRoles() {
  const roles = state.roles.filter(r => selectedRoleIds.has(r.id));
  if (roles.length === 0) { errorModal('Nothing selected', 'Select at least one role first.'); return; }
  showExportModal('Export ' + roles.length + ' Role' + (roles.length > 1 ? 's' : ''), JSON.stringify({ type:'tribunal-roles', roles }, null, 2));
}
function exportSelectedSecondaryRoles() {
  const secondaryRoles = state.secondaryRoles.filter(s => selectedSecondaryRoleIds.has(s.id));
  if (secondaryRoles.length === 0) { errorModal('Nothing selected', 'Select at least one bond first.'); return; }
  showExportModal('Export ' + secondaryRoles.length + ' Bond' + (secondaryRoles.length > 1 ? 's' : ''), JSON.stringify({ type:'tribunal-secondary-roles', secondaryRoles }, null, 2));
}

function openImportModal() {
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2">Import</h3>
    <p class="text-sm text-paper/60 mb-3">Paste a Tribunal role or bond export below. Imported entries are added alongside your existing ones — nothing is overwritten.</p>
    <textarea id="importTextarea" placeholder="Paste JSON here" class="w-full h-40 bg-panel2 border border-hairline rounded-xl px-3 py-2 text-xs font-mono mb-3 focus:outline-none focus:border-gold"></textarea>
    <button onclick="confirmImport()" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Import</button>
  `);
}
function confirmImport() {
  const raw = ($('#importTextarea').value || '').trim();
  if (!raw) { errorModal('Nothing to import', 'Paste some exported text first.'); return; }
  let data;
  try { data = JSON.parse(raw); } catch(e) { errorModal('Invalid data', "That doesn't look like valid exported text."); return; }

  if (data && data.type === 'tribunal-secondary-roles' && Array.isArray(data.secondaryRoles)) {
    let added = 0;
    data.secondaryRoles.forEach(s => {
      if (!s || !s.name) return;
      const clone = { ...s };
      const existingIds = new Set(state.secondaryRoles.map(x => x.id));
      if (!clone.id || existingIds.has(clone.id)) {
        clone.id = clone.name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now().toString(36) + Math.floor(Math.random()*1000);
      }
      clone.groupSize = Math.max(2, parseInt(clone.groupSize) || 2);
      clone.maxGroups = Math.max(1, parseInt(clone.maxGroups) || 1);
      clone.probability = Math.max(0, Math.min(100, parseInt(clone.probability) ?? 20));
      clone.description = clone.description || '';
      state.secondaryRoles.push(clone);
      added++;
    });
    saveState();
    closeModal();
    render();
    showModal(`
      <h3 class="font-display text-lg uppercase mb-2 text-town">Imported</h3>
      <p class="text-sm text-paper/60 mb-4">${added} bond${added === 1 ? '' : 's'} added to your list.</p>
      <button onclick="closeModal()" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Done</button>
    `);
    return;
  }

  let importedRoles = [];
  if (data && data.type === 'tribunal-roles' && Array.isArray(data.roles)) importedRoles = data.roles;
  else if (Array.isArray(data)) importedRoles = data;
  else { errorModal('Unrecognized format', "This text doesn't match a Tribunal export."); return; }

  let added = 0;
  importedRoles.forEach(r => {
    if (!r || !r.name) return;
    const clone = { ...r };
    const existingIds = new Set(state.roles.map(x => x.id));
    if (!clone.id || existingIds.has(clone.id)) {
      clone.id = clone.name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now().toString(36) + Math.floor(Math.random()*1000);
    }
    clone.alignment = ['town','mafia','neutral'].includes(clone.alignment) ? clone.alignment : 'town';
    clone.wakeOrder = parseInt(clone.wakeOrder) || 0;
    clone.isBase = false; // imported roles are always regular special roles — a game only ever has one base Mafia and one base Town role
    clone.maxCount = Math.max(1, parseInt(clone.maxCount) || 1);
    clone.probability = Math.max(0, Math.min(100, parseInt(clone.probability) ?? 50));
    delete clone.teamSize;
    delete clone.isPair;
    clone.description = clone.description || '';
    state.roles.push(clone);
    added++;
  });

  saveState();
  closeModal();
  render();
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2 text-town">Imported</h3>
    <p class="text-sm text-paper/60 mb-4">${added} role${added === 1 ? '' : 's'} added to your list.</p>
    <button onclick="closeModal()" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Done</button>
  `);
}

      </div>
      <div>
        <label class="text-xs case-stamp text-gold/70">DESCRIPTION</label>
        <textarea id="f_desc" rows="3" placeholder="What does this role do?" class="mt-1 w-full bg-panel border border-hairline rounded-xl px-4 py-3 text-paper focus:outline-none focus:border-gold resize-none">${r.description}</textarea>
      </div>
      <div>
        <label class="text-xs case-stamp text-gold/70">WAKE ORDER</label>
        <input id="f_wake" type="number" min="0" value="${r.wakeOrder}" class="mt-1 w-full bg-panel border border-hairline rounded-xl px-4 py-3 text-paper focus:outline-none focus:border-gold">
        <p class="text-[11px] text-paper/30 mt-1">0 = no night action</p>
      </div>

      ${isBaseRole && r.alignment === 'mafia' ? `
      <div>
        <label class="text-xs case-stamp text-gold/70">MAFIA TEAM SIZE</label>
        <input id="f_teamsize" type="number" min="1" value="${r.teamSize}" class="mt-1 w-full bg-panel border border-hairline rounded-xl px-4 py-3 text-paper focus:outline-none focus:border-gold">
        <p class="text-[11px] text-paper/30 mt-1">Total players on the Mafia team, including any Mafia-aligned special roles below. Everyone else starts as Town.</p>
      </div>
      ` : isBaseRole ? `
      <div class="bg-panel border border-hairline rounded-xl px-4 py-3 text-sm text-paper/60">
        Every Town player who isn't rolled into a special role becomes this role. No count to set — it simply fills what's left.
      </div>
      ` : `
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs case-stamp text-gold/70">NUMBER</label>

            <span class="text-paper/40 text-sm">%</span>
          </div>
          <p class="text-[11px] text-paper/30 mt-1">Chance per eligible player</p>
        </div>
      </div>
      <input id="f_weight" type="range" min="0" max="100" step="1" value="${r.probability}" class="w-full -mt-2" oninput="document.getElementById('f_weight_num').value=this.value">

function selectAlign(a) {
  window.__editAlign = a;
  document.querySelectorAll('.align-btn').forEach(b => {
    const align = b.dataset.align;
    const c = alignColor(align);
    b.className = align === a
      ? `align-btn btn-press py-3 rounded-xl border bg-${c} text-ink border-${c} font-semibold`
      : `align-btn btn-press py-3 rounded-xl border bg-panel border-hairline text-paper/60`;
  });
}
function saveRole(id) {
  const name = $('#f_name').value.trim();
  if (!name) { errorModal('Missing name', 'Every role needs a name.'); return; }
  const existing = id ? roleById(id) : null;
  const isBaseRole = !!(existing && existing.isBase);

  const payload = {
    name,
    alignment: isBaseRole ? existing.alignment : (window.__editAlign || 'town'),
    description: $('#f_desc').value.trim(),
    wakeOrder: parseInt($('#f_wake').value) || 0,
    isBase: isBaseRole,
  };

  if (isBaseRole && payload.alignment === 'mafia') {
    payload.teamSize = Math.max(1, parseInt($('#f_teamsize').value) || 1);
  } else if (!isBaseRole) {
    payload.maxCount = Math.max(1, parseInt($('#f_max_num').value) || 1);
    payload.probability = Math.max(0, Math.min(100, parseInt($('#f_weight_num').value) || 0));
  }

  if (id) {
    Object.assign(roleById(id), payload);
  } else {
    payload.id = payload.name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + Date.now().toString(36);
    state.roles.push(payload);
  }
  saveState();
  goto('settings');
}
function deleteRole(id) {
  const role = roleById(id);
  if (role && role.isBase) { errorModal('Base role', "Base roles can't be deleted — they're required as fallbacks."); return; }
  showModal(`
    <h3 class="font-display text-lg uppercase mb-2 text-mafia">Delete this role?</h3>
    <p class="text-sm text-paper/60 mb-4">This can't be undone.</p>

/* ============================ GAME ENGINE ================================= */

/**
 * Assigns primary roles to a list of player names (Among-Us-style team size + per-role
 * probability), then layers independent secondary "bond" roles on top of the result.
 */
function assignRoles(playerNames) {
  const total = playerNames.length;
  const roles = state.roles;

  const mafiaBase = roles.find(r => r.isBase && r.alignment === 'mafia');
  const townBase = roles.find(r => r.isBase && r.alignment === 'town');
  if (!mafiaBase || !townBase) {
    return { error: 'Your role list needs one base Mafia role and one base Town role (like Villager) to generate a game. Check Settings → Roles.' };
  }
  const mafiaTeamSize = Math.max(1, mafiaBase.teamSize || 1);
  if (mafiaTeamSize >= total) {
    return { error: `Mafia team size (${mafiaTeamSize}) leaves no room for any Town players out of ${total} total. Lower it on the ${mafiaBase.name} role.` };
  }

  // Split players into a Mafia pool and a Town pool up front — mirrors Among Us's Impostor count
  const order = shuffleArr(playerNames.map((_, i) => i));
  const mafiaPool = order.slice(0, mafiaTeamSize);
  const townPool = order.slice(mafiaTeamSize); // Town + Neutral special roles are drawn from here

  const resultRoleId = new Array(total).fill(null);

  // Rolls each eligible special role independently against its own Probability, up to its own Number cap,
  // for every open slot in the given pool. Anyone left unassigned gets the pool's base/fallback role.
  function rollSpecialRoles(alignments, poolIndices, baseRole) {
    const specials = shuffleArr(roles.filter(r => !r.isBase && alignments.includes(r.alignment) && r.probability > 0 && r.maxCount > 0));
    let unassigned = poolIndices.slice();

    specials.forEach(role => {
      let assignedCount = 0;
      const slotsToTry = shuffleArr(unassigned);
      for (const idx of slotsToTry) {
        if (assignedCount >= role.maxCount) break;
        if (resultRoleId[idx] !== null) continue; // already taken by a previously-rolled role this pass
        if (Math.random() * 100 < role.probability) {
          resultRoleId[idx] = role.id;
          assignedCount += 1;
        }
      }
      unassigned = unassigned.filter(j => resultRoleId[j] === null);
    });

    unassigned.forEach(idx => { resultRoleId[idx] = baseRole.id; });
  }

  rollSpecialRoles(['mafia'], mafiaPool, mafiaBase);
  rollSpecialRoles(['town','neutral'], townPool, townBase); // Neutral roles are drawn from the Town-side pool

  let players = playerNames.map((name, i) => ({ name, roleId: resultRoleId[i], alive:true, notes:'', secondaryRoleId:null, secondaryGroupmates:[] }));
  players = applySecondaryRoles(players);
  return { error:null, players };
}

/**
 * Layers "bond" roles (e.g. Twins) on top of the already-assigned primary roles.
 * Draws from ALL players regardless of their primary role or team, so one Twin can be
 * Mafia while the other is Doctor — the bond is completely independent of alignment.
 */
function applySecondaryRoles(players) {
  const secondaries = shuffleArr((state.secondaryRoles || []).filter(s => s.probability > 0 && (s.groupSize || 2) >= 2 && (s.maxGroups || 1) > 0));
  const n = players.length;
  const takenBy = new Array(n).fill(null); // secondary role id claiming this player, if any

  secondaries.forEach(sec => {
    const groupSize = Math.max(2, sec.groupSize || 2);
    const maxGroups = Math.max(1, sec.maxGroups || 1);
    let groupsFormed = 0;
    let unassigned = players.map((_, i) => i).filter(i => takenBy[i] === null);
    const slotsToTry = shuffleArr(unassigned);

    for (const idx of slotsToTry) {
      if (groupsFormed >= maxGroups) break;
      if (takenBy[idx] !== null) continue;
      const candidates = unassigned.filter(j => j !== idx && takenBy[j] === null);
      if (candidates.length < groupSize - 1) continue;
      if (Math.random() * 100 < sec.probability) {
        const partners = shuffleArr(candidates).slice(0, groupSize - 1);
        const groupIdx = [idx, ...partners];
        groupIdx.forEach(gi => { takenBy[gi] = sec.id; });
        groupIdx.forEach(gi => {
          players[gi].secondaryRoleId = sec.id;
          players[gi].secondaryGroupmates = groupIdx.filter(x => x !== gi).map(x => players[x].name);
        });
        groupsFormed++;
        unassigned = unassigned.filter(j => takenBy[j] === null);
      }
    }
  });

  return players;
}

function teammatesFor(player, allPlayers) {
  if (!state.settings.teammateAwareness) return [];
  const role = roleById(player.roleId);
  if (!role) return [];
  if (role.alignment === 'mafia') return allPlayers.filter(p => p !== player && roleById(p.roleId) && roleById(p.roleId).alignment === 'mafia').map(p => p.name);
  return [];
}

function initPassOrderDrag() {
  const container = document.getElementById('passOrderList');
  if (!container) return;
  const rows = Array.from(container.querySelectorAll('.pass-order-row'));
  if (rows.length < 2) return; // nothing to reorder

  const order = rows.map(r => parseInt(r.dataset.idx)); // absolute session.players index, top-to-bottom
  const rowRect = rows[0].getBoundingClientRect();
  const rowHeight = rowRect.height + 4; // +4px for the space-y-1 gap

  let dragRow = null, dragStartIdx = -1, startY = 0, currentShift = 0;

  rows.forEach((row, visualIdx) => {
    const handle = row.querySelector('.drag-handle');
    if (!handle) return;
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      dragRow = row;
      dragStartIdx = visualIdx;
      startY = e.clientY;
      currentShift = 0;
      row.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });

  function onMove(e) {
    if (!dragRow) return;
    e.preventDefault();
    const dy = e.clientY - startY;
    let shift = Math.round(dy / rowHeight);
    const minShift = -dragStartIdx;
    const maxShift = rows.length - 1 - dragStartIdx;
    shift = Math.max(minShift, Math.min(maxShift, shift));
    currentShift = shift;
    dragRow.style.transform = `translateY(${dy}px)`;
    rows.forEach((row, visualIdx) => {
      if (row === dragRow) return;
      let rowShift = 0;
      if (shift > 0 && visualIdx > dragStartIdx && visualIdx <= dragStartIdx + shift) rowShift = -1;
      else if (shift < 0 && visualIdx < dragStartIdx && visualIdx >= dragStartIdx + shift) rowShift = 1;
      row.style.transform = rowShift ? `translateY(${rowShift * rowHeight}px)` : '';
    });
  }

  function onUp() {
    if (!dragRow) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    dragRow.classList.remove('dragging');
    dragRow.style.transform = '';
    rows.forEach(row => { row.style.transform = ''; });

    if (currentShift !== 0) {
      const newOrder = order.slice();
      const [moved] = newOrder.splice(dragStartIdx, 1);
      newOrder.splice(dragStartIdx + currentShift, 0, moved);
      commitPassOrder(newOrder);
    }
    dragRow = null;
  }
}
function commitPassOrder(newOrderIdxArray) {
  const subArray = newOrderIdxArray.map(i => session.players[i]);
  session.players = session.players.slice(0, session.passIndex).concat(subArray);
  saveSession();
  render();
}
function advancePassPlay() {
  session.passIndex++;
  session.passRevealed = false;

  render();
}

function logNightAndClear() {

    .map((p,i) => ({ p, i, role: roleById(p.roleId) }))
    .filter(x => x.role && x.role.wakeOrder > 0 && x.p.alive)
    .sort((a,b) => a.role.wakeOrder - b.role.wakeOrder);
  const actions = nightOrder

function formatTime(sec) {
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function timerToggle() {
  if (session.timer.running) {
    stopTimerInterval();
  } else {
    session.timer.running = true;
    session.timer.intervalId = setInterval(() => {
      if (session.timer.remaining > 0) {
        session.timer.remaining--;
        const d = $('#timerDisplay');
        if (d) d.textContent = formatTime(session.timer.remaining);
        if (session.timer.remaining % 5 === 0) saveSession();
      } else {
        stopTimerInterval();
        saveSession();
      }
    }, 1000);
  }
  render();
}
function stopTimerInterval() {
  if (session.timer.intervalId) clearInterval(session.timer.intervalId);
  session.timer.intervalId = null;
  session.timer.running = false;
}
function timerReset() { stopTimerInterval(); session.timer.remaining = session.timer.seconds; saveSession(); render(); }
function timerEnd() { stopTimerInterval(); session.timer.remaining = 0; saveSession(); render(); }
function setDefaultTimer(minutesVal) {
  const minutes = Math.max(1, parseFloat(minutesVal) || 5);
  const seconds = Math.round(minutes * 60);
  state.settings.defaultTimerSeconds = seconds;
  saveState();
  // Only snap the live timer to the new default if it isn't already running mid-countdown
  if (!session.timer.running) {
    session.timer.seconds = seconds;
    session.timer.remaining = seconds;
    saveSession();
  }
}
function timerAdjust(d) {
  session.timer.seconds = Math.max(30, session.timer.seconds + d);
  session.timer.remaining = Math.max(0, session.timer.remaining + d);
  saveSession();
  render();
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) {}
  ta.remove();
}

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' },
];
const PEER_OPEN_TIMEOUT_MS = 10000;

function createHostPeer() {
  session.isHost = true;
  if (!session.roomCode) session.roomCode = genRoomCode();
  session.onlinePlayers = [];
  session.peerStatus = 'connecting';
  session.peerError = null;

  if (session.peer) { try { session.peer.destroy(); } catch(e){} session.peer = null; }

  let settled = false;
  const openTimeout = setTimeout(() => {
    if (settled) return;
    settled = true;
    session.peerStatus = 'failed';
    session.peerError = "Taking too long to reach the relay. This can happen on restrictive Wi-Fi/mobile networks — try switching networks or retrying.";
    render();
  }, PEER_OPEN_TIMEOUT_MS);

  try {
    session.peer = new Peer('mafia-' + session.roomCode, { config: { iceServers: ICE_SERVERS }, debug: 0 });

    session.peer.on('open', () => {
      if (settled) return;
      settled = true;
      clearTimeout(openTimeout);
      session.peerStatus = 'connected';
      render();
    });

    session.peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'join') {
          // De-dupe: if this name already has a connection (e.g. they reconnected), swap it in instead of duplicating
          const existing = session.onlinePlayers.find(p => p.name === data.name);
          if (existing) existing.conn = conn;
          else session.onlinePlayers.push({ name: data.name, conn });
          render();
        }
      });
      conn.on('close', () => {
        session.onlinePlayers = session.onlinePlayers.filter(p => p.conn !== conn);
        render();
      });
    });

    session.peer.on('disconnected', () => {
      // Underlying signaling socket dropped — the connection to the relay can usually recover on its own
      if (session.peerStatus !== 'failed') session.peerStatus = 'reconnecting';
      render();
      try { session.peer.reconnect(); } catch(e) {}
    });

    session.peer.on('close', () => {
      session.peerStatus = 'failed';
      session.peerError = 'The connection to the relay closed.';
      render();
    });

    session.peer.on('error', (err) => {
      if (err && err.type === 'unavailable-id') {
        // Extremely rare room-code collision — silently pick a new code and retry
        clearTimeout(openTimeout);
        settled = true;
        session.roomCode = genRoomCode();
        createHostPeer();
        return;
      }
      if (settled) { // error after we already connected — surface as reconnecting/failed, don't spam a modal
        session.peerStatus = 'failed';
        session.peerError = 'Connection error: ' + (err && err.type) + '.';
        render();
        return;
      }
      settled = true;
      clearTimeout(openTimeout);
      session.peerStatus = 'failed';
      session.peerError = (err && err.type === 'network')
        ? 'No network route to the relay. Check your internet connection.'
        : 'Could not start the online session (' + (err && err.type) + ').';
      render();
    });
  } catch(e) {
    clearTimeout(openTimeout);
    session.peerStatus = 'failed';
    session.peerError = 'The peer-to-peer library failed to load. Check your internet connection.';
    render();
  }
}
function retryHostConnection() {
  session.roomCode = null; // fresh code on manual retry, in case the old one is the problem
  createHostPeer();
}

function distributeOnlineRoles() {
  if (session.hostPlaysAlong && !session.hostName.trim()) { errorModal('Missing name', 'Enter a name for yourself before distributing roles.'); return; }
  const hostName = session.hostPlaysAlong ? session.hostName.trim() : null;
  const names = session.onlinePlayers.map(p => p.name);
  if (hostName) {
    if (names.includes(hostName)) { errorModal('Name already taken', 'A connected player already has that name — pick a different one for yourself.'); return; }
    names.push(hostName);
  }
  const result = assignRoles(names);
  if (result.error) { errorModal('Cannot start game', result.error); return; }
  session.players = result.players;
  session.gmUnlocked = false;
  session.nightTargets = {};
  session.nightHistory = [];
  session.nightNumber = 1;
  session.players.forEach(p => {
    const op = session.onlinePlayers.find(o => o.name === p.name);
    const role = roleById(p.roleId);
    const teammates = teammatesFor(p, session.players);
    const secondary = p.secondaryRoleId ? secondaryRoleById(p.secondaryRoleId) : null;
    const secondaryPayload = secondary ? { name: secondary.name, description: secondary.description, groupmates: p.secondaryGroupmates } : null;
    if (op) {
      op.conn.send({ type:'role', role: { name: role.name, alignment: role.alignment, description: role.description, wakeOrder: role.wakeOrder }, teammates, secondary: secondaryPayload });
    } else if (hostName && p.name === hostName) {
      session.hostRole = { name: role.name, alignment: role.alignment, description: role.description, wakeOrder: role.wakeOrder };
      session.hostTeammates = teammates;
      session.hostSecondary = secondaryPayload;
    }
  });
  state.stats.gamesPlayed++;
  state.stats.lastPlayerCount = names.length;
  saveState();
  saveSession();
  if (hostName) {
    goto('onlineHostReveal');
  } else {
    showModal(`
      <h3 class="font-display text-lg uppercase mb-2 text-town">Roles sent</h3>
      <p class="text-sm text-paper/60 mb-4">Every connected player now has their secret role on their own device.</p>
      <button onclick="closeModal(); goto('gmGate');" class="btn-press w-full py-3 rounded-xl bg-gold text-ink font-semibold">Open GM Dashboard</button>
    `);
  }
}

        <p class="text-paper font-medium text-sm">With: ${secondary.groupmates.join(', ')}</p>
      </div>` : ''}
      <p class="text-center text-paper/30 text-xs mt-4 mb-4">Everyone else's roles are already on their own devices. Continue to the dashboard when you're ready — you'll appear in the player list too.</p>
      <button onclick="goto('gmGate')" class="btn-press w-full py-4 rounded-xl bg-gold text-ink font-display text-lg uppercase tracking-wide">Continue to GM Dashboard</button>
    </div>
  `;
}

function leaveOnline() {
  if (session.peer) { try { session.peer.destroy(); } catch(e){} }
  session.peer = null;
  session.roomCode = null;
  session.onlinePlayers = [];
  session.clientConn = null;
  showHostQR = false;
  session.hostPlaysAlong = false;
  session.hostName = '';
  session.hostRole = null;
  session.hostTeammates = [];
  session.hostSecondary = null;
  session.mySecondary = null;
  session.peerStatus = 'connecting';
  session.peerError = null;
  session.clientStatus = 'connecting';
  session.clientError = null;
}

/* --- CLIENT --- */
function renderOnlineClient(root) {
  root.innerHTML = `
    ${topBar('Join Game', { back: "goto('onlineMenu')" })}
    <div class="flex-1 flex flex-col justify-center px-6 gap-4">
      <div>
        <label class="text-xs case-stamp text-gold/70">ROOM CODE</label>
        <input id="joinCode" maxlength="4" value="${prefillJoinCode || ''}" placeholder="ABCD" class="mt-1 w-full bg-panel border border-hairline rounded-xl px-4 py-4 text-center font-display text-3xl tracking-[0.3em] uppercase focus:outline-none focus:border-gold">
      </div>
      <div>
        <label class="text-xs case-stamp text-gold/70">YOUR NAME</label>
        <input id="joinName" placeholder="Enter your name" class="mt-1 w-full bg-panel border border-hairline rounded-xl px-4 py-3 focus:outline-none focus:border-gold">
      </div>
      <button onclick="joinOnlineGame()" class="btn-press w-full py-4 rounded-xl bg-town text-ink font-display text-lg uppercase tracking-wide mt-2">Join Room</button>
    </div>
  `;
}
function joinOnlineGame() {
  const code = $('#joinCode').value.trim().toUpperCase();
  const name = $('#joinName').value.trim();
  if (code.length !== 4) { errorModal('Invalid code', 'Room codes are exactly 4 letters.'); return; }
  if (!name) { errorModal('Missing name', 'Please enter your name.'); return; }
  session.isHost = false;
  session.joinCode = code;
  session.joinName = name;
  attemptJoin();
}
function attemptJoin() {
  goto('onlineClientWait');
  session.clientStatus = 'connecting';
  session.clientError = null;

  if (session.peer) { try { session.peer.destroy(); } catch(e){} session.peer = null; }

  let settled = false;
  const openTimeout = setTimeout(() => {
    if (settled) return;
    settled = true;
    session.clientStatus = 'failed';
    session.clientError = 'Taking too long to reach the relay. This can happen on restrictive Wi-Fi/mobile networks — try switching networks or retrying.';
    render();
  }, PEER_OPEN_TIMEOUT_MS);

  try {
    session.peer = new Peer(undefined, { config: { iceServers: ICE_SERVERS }, debug: 0 });

    session.peer.on('open', () => {
      const conn = session.peer.connect('mafia-' + session.joinCode, { reliable: true, serialization: 'json' });
      session.clientConn = conn;

      const connectTimeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        clearTimeout(openTimeout);
        session.clientStatus = 'failed';
        session.clientError = "Couldn't reach that room. Double-check the code with the host, and that they're still on the Hosting screen.";
        render();
      }, PEER_OPEN_TIMEOUT_MS);

      conn.on('open', () => {
        if (settled) return;
        settled = true;
        clearTimeout(openTimeout); clearTimeout(connectTimeout);
        session.clientStatus = 'connected';
        conn.send({ type:'join', name: session.joinName });
        render();
      });
      conn.on('data', (data) => {
        if (data.type === 'role') { session.myRole = data.role; session.myTeammates = data.teammates || []; session.mySecondary = data.secondary || null; goto('onlineClientRole'); }
      });
      conn.on('close', () => {
        if (session.view === 'onlineClientWait') {
          session.clientStatus = 'failed';
          session.clientError = 'Lost connection to the host.';
          render();
        }
      });
      conn.on('error', () => {
        if (settled) return;
        settled = true;
        clearTimeout(openTimeout); clearTimeout(connectTimeout);
        session.clientStatus = 'failed';
        session.clientError = "Couldn't reach that room. Double-check the code with the host.";
        render();
      });
    });

    session.peer.on('disconnected', () => {
      try { session.peer.reconnect(); } catch(e) {}
    });

    session.peer.on('error', (err) => {
      if (settled) return;
      settled = true;
      clearTimeout(openTimeout);
      session.clientStatus = 'failed';
      session.clientError = (err && err.type === 'peer-unavailable')
        ? "That room code doesn't exist right now — confirm it with the host."
        : ('Connection error (' + (err && err.type) + '). Check your internet connection.');
      render();
    });
  } catch(e) {
    clearTimeout(openTimeout);
    session.clientStatus = 'failed';
    session.clientError = 'The peer-to-peer library failed to load.';
    render();
  }
}
function retryJoin() { attemptJoin(); }

function renderOnlineClientWait(root) {
  const failed = session.clientStatus === 'failed';
  root.innerHTML = failed ? `
    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
      <div class="w-14 h-14 rounded-full bg-mafiaDim border border-mafia flex items-center justify-center mb-6 text-mafia text-2xl font-bold">!</div>
      <h2 class="font-display text-2xl uppercase mb-2">Connection failed</h2>
      <p class="text-paper/50 text-sm mb-6 max-w-xs">${session.clientError || 'Something went wrong connecting to the room.'}</p>
      <button onclick="retryJoin()" class="btn-press w-full max-w-xs py-4 rounded-xl bg-gold text-ink font-display uppercase tracking-wide mb-3">Try Again</button>
      <button onclick="goto('onlineClient')" class="text-paper/40 text-sm underline">Change room code</button>
    </div>
  ` : `
    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
      <div class="w-14 h-14 rounded-full border-2 border-gold/30 border-t-gold animate-spin mb-6"></div>
      <h2 class="font-display text-2xl uppercase mb-2">${session.clientStatus === 'connected' ? 'Connected — waiting for host' : 'Connecting…'}</h2>
      <p class="text-paper/40 text-sm">Your role will appear automatically once the Game Master distributes roles.</p>
    </div>
  `;
}
function renderOnlineClientRole(root) {
  const role = session.myRole;
  const c = alignColor(role.alignment);
  const secondary = session.mySecondary;
  root.innerHTML = `
    <div class="flex-1 flex flex-col px-6 py-10">
      <div class="bg-panel border border-${c}/40 rounded-2xl p-6 flex flex-col tab-fold relative overflow-hidden">
        <div class="absolute top-0 right-0 bg-${c} text-ink text-xs font-bold px-3 py-1 rounded-bl-xl case-stamp">${alignLabel(role.alignment)}</div>
        <div class="w-3 h-3 rounded-full bg-${c} mb-3 mt-2"></div>
        <h2 class="font-display text-3xl uppercase text-${c} mb-3">${role.name}</h2>
        <p class="text-paper/70 text-sm leading-relaxed mb-4">${role.description || 'No description provided.'}</p>
        ${role.wakeOrder > 0 ? `<p class="text-xs text-gold/70 case-stamp mb-3">NIGHT ACTION · WAKE ORDER #${role.wakeOrder}</p>` : ''}
        ${session.myTeammates && session.myTeammates.length ? `
          <div class="mt-4 pt-4 border-t border-hairline">
            <p class="text-xs case-stamp text-paper/40 mb-1">YOUR TEAM</p>
            <p class="text-paper font-medium">${session.myTeammates.join(', ')}</p>
          </div>` : ''}
      </div>
      ${secondary ? `
      <div class="bg-panel2 border border-gold/40 rounded-2xl p-5 mt-4">
        <p class="text-xs case-stamp text-gold/70 mb-1">SECRET BOND · ${secondary.name.toUpperCase()}</p>
        <p class="text-paper/70 text-sm leading-relaxed mb-2">${secondary.description || ''}</p>
        <p class="text-paper font-medium text-sm">With: ${secondary.groupmates.join(', ')}</p>
      </div>` : ''}
      <p class="text-center text-paper/30 text-xs mt-6">Keep this screen private. Do not show it to other players.</p>
    </div>
  `;
}

/* ================================ Boot ===================================== */
render();

</script>
</body>
</html>
